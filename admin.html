<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Pharmacists Day Trivia — Host</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2A1206;--ink2:#3E1D0C;--mint:#FBEFD2;--dim:#C9A87E;--amber:#F0A828;--amberd:#C8371F;--label:#FBEFD2;--link:#2A1206;--alert:#C8371F;--ok:#2E7D5B;--disp:"Barlow Condensed",Arial,sans-serif;--body:"Barlow",Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--mint);font-family:var(--body);background-image:radial-gradient(circle at 18% 6%,rgba(240,168,40,.20) 0,transparent 42%),radial-gradient(circle at 84% 24%,rgba(200,55,31,.16) 0,transparent 44%),linear-gradient(170deg,#3E1D0C 0%,var(--ink) 55%,#1B0B03 100%);min-height:100vh}
  body::before{content:'';position:fixed;inset:-240px;pointer-events:none;z-index:0;background-image:var(--bgtile);
    background-size:240px 240px;animation:drift 80s linear infinite}
  @keyframes drift{to{transform:translate(240px,240px)}}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 45% 40%,transparent 35%,rgba(20,8,2,.5) 100%)}
  #stkLayer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  #stkLayer .stk{position:absolute}
  .stk{display:inline-block;filter:drop-shadow(3px 6px 5px rgba(0,0,0,.45));pointer-events:none;user-select:none;vertical-align:middle}
  .stk svg{width:100%;height:100%;display:block}
  .bob{animation:bob 3.4s ease-in-out infinite}.bob.b2{animation-duration:4s;animation-delay:-1.3s}.bob.b3{animation-duration:3s;animation-delay:-2.1s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-9px) rotate(calc(var(--r,0deg) + 4deg))}}
  .stkrow{display:flex;gap:14px;align-items:center;margin:4px 0 10px}
  .lblstk{position:absolute;top:-40px;right:-30px;z-index:3}
  .label .qmeta{padding-right:40px}
  .label{position:relative}
  .podstk{display:flex;justify-content:space-between;margin:-4px 6px 0}
  @media (prefers-reduced-motion:reduce){ body::before,.bob{animation:none!important} }
  .wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:18px 20px 40px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    header .logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:800;font-size:30px;color:var(--amber)}
  .rxlogo{width:30px;height:30px;color:var(--amber);flex:none}
  .checkband{height:14px;width:100%;
    background-image:linear-gradient(45deg,var(--amberd) 25%,transparent 25%,transparent 75%,var(--amberd) 75%),
                     linear-gradient(45deg,var(--amberd) 25%,transparent 25%,transparent 75%,var(--amberd) 75%);
    background-size:14px 14px;background-position:0 0,7px 7px;border-radius:99px;margin-bottom:14px;opacity:.9} header .logo small{color:var(--mint);font-weight:600;font-size:18px}
  header .room{font-family:var(--disp);color:var(--dim);font-size:18px} header .room b{color:var(--amber);font-size:22px}
  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--ink2);border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
  h2{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--amber);margin-bottom:10px}
  button{font-family:var(--disp);font-weight:700;cursor:pointer;border-radius:10px;border:1.5px solid #3A5A52;background:transparent;color:var(--mint);padding:12px 18px;font-size:17px}
  button.primary{background:var(--amber);border-color:var(--amber);color:var(--link);font-weight:800}
  button.danger{border-color:var(--alert);color:#F3B4A8}
  button:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input{border:2px solid #3A5A52;background:var(--ink);color:var(--mint);border-radius:10px;padding:12px;font-size:18px;font-family:var(--body)}

  /* join card */
  .join{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  #qr{background:#fff;padding:10px;border-radius:12px;width:180px;height:180px;display:flex;align-items:center;justify-content:center}
  #qr img,#qr canvas{width:100%;height:100%}
  .join .link{flex:1;min-width:220px}
  .join .link .url{font-family:var(--body);font-size:16px;word-break:break-all;background:var(--ink);border-radius:10px;padding:12px;color:var(--mint);border:1px dashed #3A5A52;margin-bottom:8px}
  .join .link .code{font-family:var(--disp);font-size:20px;color:var(--dim)}.join .link .code b{color:var(--amber);font-size:30px}

  /* the on-screen question the host reads */
  .label{background:var(--label);color:var(--link);border-radius:14px;padding:16px 18px;box-shadow:inset 0 0 0 3px var(--amber)}
  .qmeta{display:flex;justify-content:space-between;font-family:var(--disp);color:var(--amberd);font-size:15px;border-bottom:2px dashed #E7C97D;padding-bottom:8px;margin-bottom:12px}
  .prompt{font-family:var(--disp);font-weight:700;font-size:clamp(22px,3vw,32px);line-height:1.05;margin-bottom:12px}
  .tray{background:#EAF0EC;border-radius:12px;box-shadow:inset 0 0 0 5px #C9D6CF;padding:8px;margin-bottom:12px}.tray svg{width:100%;max-height:280px;height:auto;display:block}
  .mock{display:grid;gap:12px;margin-bottom:12px;grid-template-columns:1fr 1fr}.mock.single{grid-template-columns:1fr}
  .cardm{background:#fff;border:2px solid #B9AE8E;border-radius:8px;padding:12px;font-family:"Courier New",monospace;color:#111;font-size:14px;line-height:1.4}
  .cardm h4{font-family:var(--disp);font-size:15px;color:var(--amberd);margin-bottom:5px}
  .cardm .bar{height:15px;margin-top:8px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 9px,#111 9px 12px,#fff 12px 14px)}
  .opts{display:grid;gap:8px}
  .optrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:10px 12px;font-family:var(--disp);font-weight:700;font-size:18px;color:var(--link);position:relative;overflow:hidden}
  .optrow .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--link);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .optrow.correct{box-shadow:inset 0 0 0 3px var(--ok)}
  .optrow .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(245,165,36,.25);transition:width .4s}
  .optrow .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--amberd);z-index:1}
  .revealans{margin-top:12px;background:var(--ink);color:var(--amber);border-radius:10px;padding:12px;font-family:var(--disp);font-weight:800;font-size:20px}
  .revealans .fact{color:var(--mint);font-weight:600;font-size:14px;margin-top:6px;font-family:var(--body)}

  .controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .prog{font-family:var(--disp);color:var(--dim);font-size:16px;margin-top:8px}
  .answered{font-family:var(--disp);font-size:34px;color:var(--amber);line-height:1}.answered small{font-size:16px;color:var(--dim)}

  /* players / leaderboard */
  .plist{max-height:280px;overflow:auto}
  .prow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #24443C}
  .prow .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}.prow .dot.off{background:#5B6E68}
  .prow .nm{flex:1;font-size:17px}.prow .sc{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--amber)}
  .prow .rk{font-family:var(--disp);color:var(--dim);width:34px;text-align:right}
  .lead .prow:nth-child(1) .rk{color:#F5C542}.lead .prow:nth-child(2) .rk{color:#CFCFCF}.lead .prow:nth-child(3) .rk{color:#D79A5B}
  .empty{color:var(--dim);text-align:center;padding:20px;font-size:15px}
  .winnerline{font-family:var(--disp);font-weight:800;font-size:clamp(26px,3.6vw,44px);color:var(--amberd);margin:6px 0 4px}
  .podium3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end;margin:10px 4px 6px}
  .pod{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .pmedal{font-size:34px;line-height:1}
  .pod.first .pmedal{font-size:46px}
  .pname{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--link);line-height:1.05;margin-top:4px;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pod.first .pname{font-size:28px}
  .pscore{font-family:var(--disp);font-size:17px;color:var(--amberd);margin-bottom:6px}
  .pblock{width:100%;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
  .pplace{font-family:var(--disp);font-weight:800;font-size:19px;color:#2A1E05}
  .pprize{font-family:var(--body);font-weight:700;font-size:12.5px;color:#4A3A12;margin-top:2px}
  .prizenote{font-family:var(--disp);font-size:16px;color:#6B5A2E;padding:6px 0 4px}
  .gate{max-width:420px;margin:16vh auto 0}
  .hint{color:var(--dim);font-size:13px;margin-top:10px;line-height:1.4}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
  .plist{max-height:190px}
  .howto{margin-top:14px;background:var(--label);color:var(--link);border-radius:14px;padding:14px 18px;box-shadow:inset 0 0 0 3px var(--amber)}
  .howto h3{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--amberd);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 6px}
  .rules{list-style:none;margin:0 0 10px;padding:0}
  .rules li{position:relative;padding-left:18px;font-size:15px;line-height:1.35;margin-bottom:5px}
  .rules li:before{content:"";position:absolute;left:3px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .rounds{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:0;counter-reset:rd}
  .rounds li{counter-increment:rd;display:grid;grid-template-columns:24px auto 1fr;align-items:baseline;column-gap:8px;font-size:14px;line-height:1.25;padding:5px 0;border-bottom:1px dashed #E7C97D}
  .rounds li:last-child{border-bottom:0}
  .rounds .ri{font-size:16px}
  .rounds b{font-family:var(--disp);font-size:16px}.rounds b:before{content:counter(rd) ". ";color:var(--amberd)}
  .rounds .rs{color:#7A5A38;font-size:13px;text-align:right}
  .resume{background:var(--alert);color:#fff;border-radius:14px;padding:14px 18px;margin-bottom:14px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
  .resume .rtitle{font-family:var(--disp);font-weight:800;font-size:24px}
  .resume .rsub{opacity:.9;margin-top:2px}
  .resume .controls button.danger{background:#fff;color:var(--alert);border-color:#fff}
  .fboard{max-height:calc(100vh - 210px);overflow-y:auto;border-radius:10px;background:rgba(0,0,0,.18)}
  .frow{display:grid;grid-template-columns:52px 1fr auto 56px;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #4A2A16;font-size:19px}
  .frow .fk{font-family:var(--disp);font-weight:800;color:var(--dim);text-align:center;font-size:18px}
  .frow.top .fk{font-size:26px}
  .frow .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .fc{font-size:14px;color:var(--dim)}
  .frow .fs{font-family:var(--disp);font-size:24px;color:var(--amber);text-align:right}
  .frow.t1{background:rgba(245,197,66,.16)}.frow.t2{background:rgba(216,216,216,.10)}.frow.t3{background:rgba(215,154,91,.12)}
  .lastwin{margin-top:14px;border-top:1px solid #4A2A16;padding-top:10px}
  .lastwin h3{font-family:var(--disp);color:var(--amber);font-size:18px;margin-bottom:4px}
  /* ---------- pressure: red closes in, card shakes harder each second ---------- */
  #press{position:fixed;inset:0;pointer-events:none;z-index:40;transition:box-shadow .3s}
  body.press1 #press{box-shadow:inset 0 0 60px rgba(228,87,61,.25)}
  body.press2 #press{box-shadow:inset 0 0 90px rgba(228,87,61,.38)}
  body.press3 #press{box-shadow:inset 0 0 130px rgba(228,87,61,.52)}
  body.press4 #press{box-shadow:inset 0 0 170px rgba(228,87,61,.66);animation:pulseg .5s ease-in-out infinite}
  body.press5 #press{box-shadow:inset 0 0 220px rgba(228,87,61,.82);animation:pulseg .3s ease-in-out infinite}
  @keyframes pulseg{50%{opacity:.6}}
  body.press3 .label,body.press3 .sdlabel{animation:shk .5s ease-in-out infinite}
  body.press4 .label,body.press4 .sdlabel{animation:shk .28s ease-in-out infinite}
  body.press5 .label,body.press5 .sdlabel{animation:shk2 .16s ease-in-out infinite}
  @keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
  @keyframes shk2{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,2px) rotate(-.4deg)}75%{transform:translate(4px,-2px) rotate(.4deg)}}
  body.press1 #cdnum,body.press2 #cdnum{color:var(--alert)}
  body.press3 #cdnum{color:var(--alert);transform:scale(1.35)}
  body.press4 #cdnum{color:var(--alert);transform:scale(1.6)}
  body.press5 #cdnum{color:var(--alert);transform:scale(1.9)}
  #cdnum{transition:transform .15s;display:inline-block}
  body.press1 .cdbar i,body.press2 .cdbar i,body.press3 .cdbar i,body.press4 .cdbar i,body.press5 .cdbar i{background:var(--alert)}
  @media (prefers-reduced-motion:reduce){ body[class*=press] .label,body[class*=press] .sdlabel,body[class*=press] #press{animation:none!important} }
  .cdwrap{display:flex;align-items:center;gap:12px;margin-top:12px}
  .cdbar{flex:1;height:12px;border-radius:99px;background:#E4D6AA;overflow:hidden}
  .cdbar i{display:block;height:100%;width:100%;background:var(--amber);transition:width .2s linear}
  .cdnum{font-family:var(--disp);font-weight:800;font-size:34px;color:var(--amberd);min-width:1.6ch;text-align:right}
  .sdtitle{font-family:var(--disp);font-weight:800;font-size:clamp(46px,7vw,86px);color:var(--alert);line-height:1;margin:10px 0 6px;letter-spacing:-.01em}
  .sdsub{font-family:var(--disp);font-size:24px;color:var(--link)}
  .sdsub b{color:var(--amberd)}
  .sdnote{font-size:15px;color:#6B5A2E;margin-top:8px}
  .sdstat{display:inline-block;background:var(--alert);color:#fff;font-family:var(--disp);font-weight:800;letter-spacing:.12em;
    padding:4px 14px;border-radius:6px;font-size:16px;margin-top:6px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}
  .rxno{color:var(--amberd);letter-spacing:.03em}
  .psig{font-family:"Courier New",monospace;font-size:11px;color:#4A3A12;margin-top:3px}
  .sdlabel{box-shadow:inset 0 0 0 4px var(--alert)}
  .sdlabel .qmeta{color:var(--alert);border-bottom-color:#F0B5A8}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="stkLayer"></div>
<div id="press"></div>
<div class="wrap" id="wrap"><div class="panel gate"><h2>Loading…</h2></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="game-core.js"></script>
<script src="music.js"></script>


<script>
(function(){
  var CFG=window.STAT_CONFIG||{};
  var ROOM=(CFG.room||'PARTY').toUpperCase();
  var wrap=document.getElementById('wrap');
  var db=null; try{ firebase.initializeApp(CFG.firebase); db=firebase.database(); }catch(e){ wrap.innerHTML='<div class="panel gate"><h2>Not set up yet</h2><div class="hint">Finish the one-time Firebase setup in README.txt, then reload this page.</div></div>'; return; }
  var base=db.ref('rooms/'+ROOM);
  // One clock for everyone: correct this device's clock by Firebase's server offset
  var OFF=0; try{ db.ref('.info/serverTimeOffset').on('value',function(s){ OFF=+(s.val()||0); }); }catch(e){}
  function now(){ return Date.now()+OFF; }
  function stk(name,size,cls,rot,extra){ return '<span class="stk '+(cls||'')+'" style="width:'+size+'px;height:'+size+'px;--r:'+(rot||0)+'deg;transform:rotate('+(rot||0)+'deg);'+(extra||'')+'">'+STAT.STICKERS[name]+'</span>'; }
  (function decorate(){
    try{
      document.documentElement.style.setProperty('--bgtile','url("'+STAT.BG_TILE+'")');
      var L=[['happy',130,'top:16%;right:3%',10,'bob'],['capsule',112,'top:44%;right:9%',-18,'bob b2'],['nacho',118,'bottom:6%;right:3%',12,'bob b3'],
             ['bottle',104,'top:66%;right:21%',-8,'bob'],['heart',92,'bottom:4%;left:3%',-12,'bob b2'],['mortar',110,'bottom:8%;left:38%',8,'bob b3'],
             ['rx',86,'top:30%;left:-26px',-10,'bob'],['blister',96,'top:62%;left:-20px',14,'bob b2'],['stat',100,'top:84%;right:38%',-6,'bob'],
             ['tablet',78,'top:22%;right:24%',6,'bob b3'],['verified',88,'bottom:22%;right:30%',-14,'bob b2'],['bandaid',84,'top:90%;left:22%',20,'bob']];
      document.getElementById('stkLayer').innerHTML=L.map(function(x){
        return '<span class="stk '+x[4]+'" style="width:'+x[1]+'px;height:'+x[1]+'px;'+x[2]+';--r:'+x[3]+'deg">'+STAT.STICKERS[x[0]]+'</span>';}).join('');
    }catch(e){}
  })();
  var state={phase:'lobby',qIndex:-1}, players={}, answers={}, scores={}, sdAnswers={};

  // ---- host PIN gate ----
  if(sessionStorage.getItem('stat_host_'+ROOM)==='1'){ boot(); }
  else gate();
  function gate(){
    wrap.innerHTML='<div class="panel gate"><h2>Host access</h2><div class="hint" style="margin-bottom:12px">Enter the host PIN from your config file.</div><div class="row"><input id="pin" type="password" placeholder="Host PIN" style="flex:1"><button class="primary" id="ok">Open</button></div></div>';
    document.getElementById('ok').onclick=function(){ if(document.getElementById('pin').value===String(CFG.hostPin)){ sessionStorage.setItem('stat_host_'+ROOM,'1'); try{STATMusic.setSong('lobby');STATMusic.start();}catch(e){} boot(); } else { document.getElementById('pin').value=''; document.getElementById('pin').placeholder='Wrong PIN'; } };
    document.getElementById('pin').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('ok').click();});
  }

  var firstState=true, lastResults=null;
  var MIDGAME={question:1,reveal:1,sudden_intro:1,sudden:1,sudden_reveal:1};
  function boot(){
    base.child('settings').set({qsec:QSEC, reveal:REVEAL_SEC, sdsec:SDSEC});
    base.child('lastResults').on('value',function(s){ lastResults=s.val(); render(); });
    // Decide where the host lands only once players/answers/sudden AND state have all loaded (avoids saving empty winners)
    var loaded={}, st0=null, decided=false;
    function decide(){
      if(decided||!loaded.state||!loaded.players||!loaded.answers||!loaded.sudden) return; decided=true;
      if(st0.phase==='ended'){ recompute(); newGame(true); }                              // finished game -> fresh waiting page
      else if(MIDGAME[st0.phase] && !st0.paused){ base.child('state').update({paused:true}); } // live game -> pause, host chooses
    }
    ['players','answers','sudden'].forEach(function(k){ base.child(k).on('value',function(){ if(!loaded[k]){ loaded[k]=1; setTimeout(decide,0); } }); });
    base.child('state').on('value',function(s){
      if(firstState){ firstState=false; st0=s.val()||{phase:'lobby'}; loaded.state=1; setTimeout(decide,0); } var prev=state.phase+'|'+state.qIndex+'|'+(state.sdIndex||0); state=s.val()||{phase:'lobby',qIndex:-1}; if(prev!==state.phase+'|'+state.qIndex+'|'+(state.sdIndex||0)) clearAuto(); render(); });
    base.child('players').on('value',function(s){ players=s.val()||{}; recompute(); render(); });
    base.child('answers').on('value',function(s){ answers=s.val()||{}; recompute(); render(); });
    base.child('sudden').on('value',function(s){ sdAnswers=s.val()||{}; render(); });
    render();
  }
  function recompute(){ scores=STAT.computeScores(players,answers); }
  /* ---------- music follows the game ---------- */
  function syncMusic(phase,q,paused){
    try{
      if(phase==='lobby'||paused) STATMusic.setSong('lobby');
      else if(phase==='question'||phase==='reveal'){ if(q) STATMusic.setSong(STATMusic.songForRound(q.roundId)); }
      else if(phase.indexOf('sudden')===0) STATMusic.setSong('sudden');
      else if(phase==='ended') STATMusic.setSong('victory');
    }catch(e){}
  }
  /* ---------- last-5-seconds pressure: climbs one level per second ---------- */
  var pressLvl=0;
  setInterval(pressTick,120);
  function pressTick(){
    var ph=state.phase, lvl=0;
    if(!state.paused && (ph==='question'||ph==='sudden') && state.endsAt){
      var left=state.endsAt-now();
      if(left>0 && left<=5000) lvl=Math.min(5, 6-Math.ceil(left/1000));
    }
    if(lvl!==pressLvl){ pressLvl=lvl;
      document.body.className=document.body.className.replace(/\bpress\d\b/g,'').trim()+(lvl?' press'+lvl:'');
      try{STATMusic.setPressure(lvl);}catch(e){}
    }
  }
  // Start a fresh game on the waiting page. Keeps players checked in; saves last winners for prize hand-out.
  function newGame(saveWinners){
    var rk=applySudden(STAT.rankPlayers(players,scores)).slice(0,3);
    var ups={ answers:null, sudden:null, state:{phase:'lobby',qIndex:-1,paused:false,endsAt:null,sdIndex:null,tiedNames:null} };
    if(saveWinners && rk.length && rk[0].score>0) ups.lastResults={ at:now(), top:rk.map(function(r){return {name:r.name,score:r.score};}) };
    Object.keys(ups).forEach(function(k){ if(ups[k]===null) base.child(k).remove(); else base.child(k).set(ups[k]); });
    clearAuto();
  }
  function setState(o){ base.child('state').update(o); }

  /* ===== Auto-advance: 10s to answer, 5s in sudden death, then auto-reveal & auto-next ===== */
  // Timing (seconds). Override for a run with ?qsec=15&reveal=5&sdsec=6 on the admin URL.
  var _qp = new URLSearchParams(location.search);
  var QSEC = +(_qp.get('qsec') || CFG.questionSeconds || 10);
  var REVEAL_SEC = +(_qp.get('reveal') || CFG.revealSeconds || 4);
  var SDSEC = +(_qp.get('sdsec') || CFG.suddenDeathSeconds || 5);
  var autoTimer=null, autoDeadline=0;
  function clearAuto(){ clearInterval(autoTimer); autoTimer=null; autoDeadline=0; }
  function startAuto(seconds, whenDone){
    clearAuto(); autoDeadline = now() + seconds*1000;
    autoTimer = setInterval(function(){
      var left = Math.ceil((autoDeadline - now())/1000);
      var el = document.getElementById('cdnum');
      if (el) el.textContent = Math.max(left,0);
      var ring = document.getElementById('cdbar');
      if (ring) ring.style.width = Math.max(0, Math.min(100,(autoDeadline-now())/(seconds*10)))+'%';
      if (now() >= autoDeadline){ clearAuto(); whenDone(); }
    }, 200);
  }
  function autoAdvance(){
    var st=state;
    if (st.phase==='question'){ try{STATMusic.duck(0.06);}catch(e){} setState({phase:'reveal', endsAt:now()+REVEAL_SEC*1000}); try{STATMusic.sting('bell');}catch(e){} }
    else if (st.phase==='reveal'){
      try{STATMusic.duck(0.16);}catch(e){}
      var ni=st.qIndex+1;
      if (ni>=STAT.QUESTIONS.length) finishMain();
      else setState({phase:'question', qIndex:ni, endsAt:now()+QSEC*1000});
    }
    else if (st.phase==='sudden'){ setState({phase:'sudden_reveal', endsAt:now()+3000}); }
    else if (st.phase==='sudden_reveal'){
      var si=(st.sdIndex||0)+1;
      if (si>=STAT.SUDDEN.length) setState({phase:'ended'});
      else setState({phase:'sudden', sdIndex:si, endsAt:now()+SDSEC*1000});
    }
  }
  function finishMain(){
    // tie for any podium place? go to sudden death
    var ranked=STAT.rankPlayers(players,scores);
    var tied=STAT.findTies(ranked);
    if (tied.length>1){ try{STATMusic.setMode('sudden');}catch(e){}
      setState({phase:'sudden_intro', sdIndex:0, endsAt:now()+6000, tiedNames:tied.map(function(t){return t.name;}).join(', ')});
    } else setState({phase:'ended'});
  }


  var playerURL=(function(){ var u=new URL(location.href); u.pathname=u.pathname.replace(/admin\.html?$/,'index.html'); u.searchParams.set('g',ROOM); u.hash=''; return u.toString(); })();

  function render(){
    var phase=state.phase, qi=state.qIndex;
    var q=(qi>=0&&qi<STAT.QUESTIONS.length)?STAT.QUESTIONS[qi]:null;
    var ranked=STAT.rankPlayers(players,scores);
    var online=Object.keys(players).filter(function(p){return players[p]&&players[p].online;}).length;

    var left, paused=!!state.paused && !!MIDGAME[phase];
    syncMusic(phase,q,paused);
    if(phase==='lobby'||paused) left=lobbyPanel(online, paused);
    else if(phase==='ended') left=finalPanel(ranked);
    else if(phase==='sudden_intro') left=suddenIntroPanel();
    else if(phase==='sudden'||phase==='sudden_reveal') left=suddenPanel(phase);
    else left=questionPanel(q,phase);

    var _fb=document.getElementById('fboard'), _fbTop=_fb?_fb.scrollTop:0;
    wrap.innerHTML=
      '<header><div class="logo"><svg class=\"rxlogo\" viewBox=\"0 0 100 100\" aria-hidden=\"true\"><path d=\"M20 46 H80 C80 68 68 80 50 80 C32 80 20 68 20 46 Z\" fill=\"currentColor\"/><rect x=\"16\" y=\"40\" width=\"68\" height=\"9\" rx=\"4.5\" fill=\"currentColor\"/><rect x=\"44\" y=\"82\" width=\"12\" height=\"6\" rx=\"3\" fill=\"currentColor\"/><path d=\"M58 38 L78 14\" stroke=\"currentColor\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"12\" r=\"7\" fill=\"currentColor\"/></svg>STAT! <small>World Pharmacists Day</small></div><div class="room"><button id="music" class="musicbtn">'+(window.STATMusic&&STATMusic.isOn()?'&#9835; '+STATMusic.songName():'&#9835; Tap for music')+'</button> &nbsp; Room <b>'+ROOM+'</b> · '+Object.keys(players).length+' joined ('+online+' online)</div></header>'+
      '<div class="grid"><div>'+left+'</div><div>'+
      '<div class="panel '+(phase==='ended'?'lead':'')+'"><h2>'+(phase==='lobby'||paused?'&#128138; Checked in':(phase==='ended'?'&#127942; Final Scoreboard &middot; '+Object.keys(players).length+' players':'&#127942; Pharmacy Leaderboard'))+'</h2>'+(phase==='lobby'||paused?playerList()+lastWinners():(phase==='ended'?fullBoard(STAT.finalRanking(players,scores,sdAnswers)):leaderboard(ranked)))+'</div>'+(phase==='lobby'||paused?roundsOnly():'')+'</div>';

    var _fb2=document.getElementById('fboard'); if(_fb2) _fb2.scrollTop=_fbTop;
    wireButtons(q,phase);
    // (re)arm the auto timer for timed phases
    if (!paused && (phase==='question'||phase==='reveal'||phase==='sudden'||phase==='sudden_reveal'||phase==='sudden_intro')){
      var secs = phase==='question'?QSEC : phase==='reveal'?REVEAL_SEC : phase==='sudden'?SDSEC : phase==='sudden_reveal'?3 : 6;
      var rem = state.endsAt ? Math.max(0,(state.endsAt-now())/1000) : secs;
      if (!autoTimer) startAuto(rem||secs, phase==='sudden_intro'
        ? function(){ setState({phase:'sudden', sdIndex:0, endsAt:now()+SDSEC*1000}); }
        : autoAdvance);
    } else clearAuto();
    if(phase==='lobby'||paused) drawQR();
    pressTick();
    if(phase==='ended') confetti();
  }

  function rulesOnly(){
    return '<div class="howto"><h3>How to play</h3><ul class="rules">'+
        '<li><b>'+QSEC+' seconds</b> per question &mdash; it moves on by itself. The last 5 seconds get <b>intense</b>.</li>'+
        '<li><b>Tap fast.</b> Ties are broken by who answered quickest.</li>'+
        '<li><b>Sudden death</b> if anyone is tied for 1st, 2nd or 3rd: 5 easy questions, '+SDSEC+' seconds each.</li>'+
        '<li><b>Prizes</b> for 1st, 2nd and 3rd. Pharmacists, techs &amp; interns all have a shot.</li>'+
      '</ul></div>';
  }
  function roundsOnly(){
    var R=STAT.roundSummary(), ic={pop:'&#127916;',pharm:'&#128138;',wager:'&#127922;'};
    return '<div class="howto"><h3>The '+R.length+' rounds</h3><ol class="rounds">'+R.map(function(r){
        return '<li><span class="ri">'+(ic[r.kind]||'&#11088;')+'</span><b>'+esc(r.name)+'</b><span class="rs">'+esc(r.short)+'</span></li>';
      }).join('')+'</ol></div>';
  }
  function lastWinners(){
    if(!lastResults||!lastResults.top||!lastResults.top.length) return '';
    var m=['&#129351;','&#129352;','&#129353;'];
    return '<div class="lastwin"><h3>Last game&rsquo;s winners</h3>'+lastResults.top.map(function(r,i){
      return '<div class="prow"><span class="rk">'+m[i]+'</span><span class="nm">'+esc(r.name)+'</span><span class="sc">'+r.score+'</span></div>';}).join('')+'</div>';
  }
  function lobbyPanel(online, paused){
    var qn=(state.qIndex|0)+1;
    var banner = paused ?
      '<div class="resume"><div class="rtitle">&#9208; A game is in progress'+(state.phase&&state.phase.indexOf('sudden')===0?' (sudden death)':' &mdash; Rx '+qn+' of '+STAT.QUESTIONS.length)+'</div>'+
      '<div class="rsub">Players&rsquo; phones show &ldquo;Paused&rdquo;. Nothing has been lost.</div>'+
      '<div class="controls"><button class="primary" id="resume">&#9654; Resume game</button><button class="danger" id="restart">Restart from the waiting page</button></div></div>' : '';
    return banner+'<div class="panel"><div class="checkband"></div><h2>&#127881; World Pharmacists Day Trivia</h2>'+
      '<div class="stkrow">'+stk('mortar',58,'bob',-8)+stk('capsule',54,'bob b2',10)+stk('happy',62,'bob b3',-6)+stk('bottle',54,'bob',8)+stk('nacho',56,'bob b2',-10)+'</div>'+
      '<div class="join"><div id="qr"></div><div class="link">'+
        '<div class="code">Room code &nbsp;<b>'+ROOM+'</b></div>'+
        '<div class="hint" style="margin:6px 0 8px">Scan to check in at the pharmacy counter, or go to:</div>'+
        '<div class="url">'+playerURL+'</div>'+
        '<button id="copy">Copy link</button>'+
      '</div></div>'+
      (paused?'':'<div class="controls"><button class="primary" id="start" '+((online||Object.keys(players).length)?'':'disabled')+'>Start game &rarr;</button><button class="danger" id="reset">Reset room</button></div>'+
      '<div class="hint">Players can keep joining right up until you start. &ldquo;Reset room&rdquo; also clears everyone&rsquo;s names.</div>')+
      '</div>'+rulesOnly();
  }
  function playerList(){
    var ks=Object.keys(players); if(!ks.length) return '<div class="empty">No one yet. Share the code.</div>';
    ks.sort(function(a,b){return (players[a].joinedAt||0)-(players[b].joinedAt||0);});
    return '<div class="plist">'+ks.map(function(p){return '<div class="prow"><span class="dot '+(players[p].online?'':'off')+'"></span><span class="nm">'+esc(players[p].name||'—')+'</span></div>';}).join('')+'</div>';
  }

  function questionPanel(q,phase){
    if(!q) return '<div class="panel"><div class="empty">…</div></div>';
    var a=answers[q.key]||{}; var counts=[0,0,0,0]; var answered=0;
    Object.keys(a).forEach(function(p){ if(players[p]){answered++; if(a[p].choice>=0&&a[p].choice<4)counts[a[p].choice]++;} });
    var total=Object.keys(players).length||1;
    var reveal=phase==='reveal';
    var qn=STAT.QUESTIONS.indexOf(q)+1;
    var cornerSet=['capsule','heart','bottle','rx','tablet','blister','mortar','nacho'];
    var corner=reveal?'verified':cornerSet[(qn-1)%cornerSet.length];
    var html='<div class="panel"><div class="label">'+stk(corner,66,'bob lblstk',reveal?-12:10)+'<div class="qmeta"><span><b class="rxno">Rx #0925-'+String(qn).padStart(2,'0')+'</b> &middot; '+esc(q.roundName)+'</span><span>'+qn+' of '+STAT.QUESTIONS.length+' &middot; '+(q.isWager?'Wager 0–5':q.pts+' pt'+(q.pts>1?'s':''))+'</span></div>';
    html+='<div class="prompt">'+esc(q.prompt)+'</div>';
    html+=STAT.extraHTML(q).replace(/class="card"/g,'class="cardm"');
    html+='<div class="opts">'+q.options.map(function(o,i){
      var w=(counts[i]/total*100); var cor=(reveal&&i===q.answer)?' correct':'';
      return '<div class="optrow'+cor+'">'+(reveal?'<div class="fill" style="width:'+w+'%"></div>':'')+'<span class="k">'+STAT.LETTERS[i]+'</span><span style="z-index:1">'+esc(o)+'</span>'+(reveal?'<span class="cnt">'+counts[i]+'</span>':'')+'</div>';
    }).join('')+'</div>';
    if(reveal) html+='<div class="revealans">&#10004; Verified answer: '+esc(q.options[q.answer])+'<div class="fact">&#128138; '+esc(q.fact)+'</div></div>';
    html+='<div class="cdwrap"><div class="cdbar"><i id="cdbar"></i></div><div class="cdnum" id="cdnum">'+(phase==='question'?QSEC:REVEAL_SEC)+'</div></div>';
    html+='</div>';
    if(phase==='question'){
      html+='<div class="prog"><span class="answered">'+answered+'<small> / '+Object.keys(players).length+' answered</small></span></div>';
      html+='<div class="controls"><button class="primary" id="reveal">&#10004; Verify now →</button></div>';
      html+='<div class="hint">Read the question aloud. It verifies automatically after '+QSEC+' seconds — or hit Verify now to move early.</div>';
    } else {
      var last=q.roundId===7;
      html+='<div class="controls"><button class="primary" id="next">'+(last?'Show final results 🏆':'Next Rx →')+'</button></div>';
      html+='<div class="hint">Read the fun fact aloud. Auto-advances in '+REVEAL_SEC+' seconds.</div>';
    }
    html+='</div>';
    return html;
  }

  function applySudden(ranked){ return STAT.finalRanking(players,scores,sdAnswers); }
  function finalPanel(ranked){
    ranked=applySudden(ranked);
    var top=ranked.slice(0,3);
    var meta=[{m:'&#129351;',t:'1st Place',p:'Grand Prize',c:'#F5C542'},
              {m:'&#129352;',t:'2nd Place',p:'Runner-Up Prize',c:'#D8D8D8'},
              {m:'&#129353;',t:'3rd Place',p:'Third Prize',c:'#D79A5B'}];
    var order=[1,0,2]; // 2nd, 1st, 3rd for podium look
    var cols=order.map(function(i){
      var r=top[i]; if(!r) return '<div class="pod empty"></div>';
      var h=[130,170,110][i];
      return '<div class="pod'+(i===0?' first':'')+'">'+
        '<div class="pmedal">'+meta[i].m+'</div>'+
        '<div class="pname">'+esc(r.name)+'</div>'+
        '<div class="pscore">'+r.score+' pts</div>'+
        '<div class="pblock" style="height:'+h+'px;background:'+meta[i].c+'">'+
          '<div class="pplace">'+meta[i].t+'</div><div class="pprize">'+meta[i].p+'</div><div class="psig">Qty 1 &middot; Refills 0</div>'+
        '</div></div>';
    }).join('');
    return '<div class="panel"><div class="label" style="text-align:center;padding-bottom:6px">'+
      '<div class="qmeta"><span>Final results</span><span>'+ranked.length+' players</span></div>'+
      '<div class="podstk">'+stk('happy',70,'bob',-12)+stk('verified',64,'bob b2',8)+'</div>'+'<div class="winnerline">&#127881; Happy World Pharmacists Day! &#127881;</div>'+
      '<div class="podium3">'+cols+'</div>'+
      '<div class="prizenote">Top 3 collect your prizes from the host'+(Object.keys(sdAnswers).length?' &middot; decided by sudden death':'')+'</div>'+
      '</div><div class="controls"><button id="newgame" class="primary">&#8635; New game (same players)</button></div></div>';
  }


  function suddenIntroPanel(){
    return '<div class="panel"><div class="label" style="text-align:center">'+
      '<div class="qmeta"><span>Tiebreaker</span><span>5 questions &middot; '+SDSEC+' seconds each</span></div>'+
      '<div class="sdstat">&#9888; STAT ORDER &#9888;</div><div class="sdtitle">SUDDEN DEATH</div>'+
      '<div class="sdsub">We have a tie: <b>'+esc(state.tiedNames||'')+'</b></div>'+
      '<div class="sdnote">Five quick pop-culture questions. Five seconds each. Fastest correct answers win.</div>'+
      '<div class="cdwrap"><div class="cdbar"><i id="cdbar"></i></div><div class="cdnum" id="cdnum">6</div></div>'+
      '</div><div class="controls"><button class="primary" id="sdgo">Start sudden death now &rarr;</button></div></div>';
  }
  function suddenPanel(phase){
    var si=state.sdIndex||0, q=STAT.SUDDEN[si], reveal=(phase==='sudden_reveal');
    var a=(sdAnswers[q.key]||{}), counts=[0,0,0,0], answered=0;
    Object.keys(a).forEach(function(p){ if(players[p]){answered++; if(a[p].choice>=0&&a[p].choice<4)counts[a[p].choice]++;} });
    var total=Object.keys(players).length||1;
    var html='<div class="panel"><div class="label sdlabel"><div class="qmeta"><span>SUDDEN DEATH &middot; '+(si+1)+' of '+STAT.SUDDEN.length+'</span><span>5 seconds</span></div>';
    html+='<div class="prompt">'+esc(q.prompt)+'</div>';
    html+='<div class="opts">'+q.options.map(function(o,i){
      var w=(counts[i]/total*100), cor=(reveal&&i===q.answer)?' correct':'';
      return '<div class="optrow'+cor+'">'+(reveal?'<div class="fill" style="width:'+w+'%"></div>':'')+
        '<span class="k">'+STAT.LETTERS[i]+'</span><span style="z-index:1">'+esc(o)+'</span>'+
        (reveal?'<span class="cnt">'+counts[i]+'</span>':'')+'</div>';
    }).join('')+'</div>';
    if(reveal) html+='<div class="revealans">Answer: '+esc(q.options[q.answer])+'</div>';
    html+='<div class="cdwrap"><div class="cdbar"><i id="cdbar"></i></div><div class="cdnum" id="cdnum">'+(reveal?3:5)+'</div></div>';
    html+='</div>';
    if(!reveal) html+='<div class="prog"><span class="answered">'+answered+'<small> / '+Object.keys(players).length+' answered</small></span></div>';
    html+='</div>';
    return html;
  }

  function fullBoard(ranked){
    var m=['&#129351;','&#129352;','&#129353;'];
    return '<div class="fboard" id="fboard">'+ranked.map(function(r){
      return '<div class="frow'+(r.rank<=3?' top t'+r.rank:'')+'"><span class="fk">'+(m[r.rank-1]||'#'+r.rank)+'</span>'+
        '<span class="fn">'+esc(r.name)+'</span><span class="fc">'+r.correct+'/'+STAT.QUESTIONS.length+'</span><b class="fs">'+r.score+'</b></div>';
    }).join('')+'</div><div class="hint" style="margin-top:8px">Scrolls by itself so everyone can find their name. Hover to pause.</div>';
  }
  /* slow auto-scroll of the final scoreboard: down, pause, back to top, repeat. Pauses while the host hovers. */
  var bScroll={dir:1,hold:0,hover:false};
  setInterval(function(){
    var b=document.getElementById('fboard'); if(!b) return;
    if(!b.dataset.w){ b.dataset.w=1; b.onmouseenter=function(){bScroll.hover=true;}; b.onmouseleave=function(){bScroll.hover=false;}; }
    if(bScroll.hover||b.scrollHeight<=b.clientHeight+2) return;
    if(bScroll.hold>0){ bScroll.hold--; return; }
    if(bScroll.dir>0){ b.scrollTop+=1; if(b.scrollTop+b.clientHeight>=b.scrollHeight-1){ bScroll.hold=90; bScroll.dir=-1; } }
    else { b.scrollTop=0; bScroll.hold=90; bScroll.dir=1; }
  },40);
  function leaderboard(ranked){
    if(!ranked.length) return '<div class="empty">Scores appear once players answer.</div>';
    var medals=['🥇','🥈','🥉'];
    return ranked.slice(0,20).map(function(r){return '<div class="prow"><span class="rk">'+(medals[r.rank-1]||('#'+r.rank))+'</span><span class="nm">'+esc(r.name)+'</span><span class="sc">'+r.score+'</span></div>';}).join('');
  }

  function wireButtons(q,phase){
    var b;
    if(b=document.getElementById('start')) b.onclick=function(){ try{STATMusic.start();}catch(e){} setState({phase:'question',qIndex:0,paused:false,endsAt:now()+QSEC*1000,game:now()}); };
    if(b=document.getElementById('reveal')) b.onclick=function(){ clearAuto(); try{STATMusic.duck(0.07);STATMusic.sting('bell');}catch(e){} setState({phase:'reveal',endsAt:now()+REVEAL_SEC*1000}); };
    if(b=document.getElementById('next')) b.onclick=function(){ clearAuto(); try{STATMusic.duck(0.19);}catch(e){} var ni=state.qIndex+1; if(ni>=STAT.QUESTIONS.length) finishMain(); else setState({phase:'question',qIndex:ni,endsAt:now()+QSEC*1000}); };
    if(b=document.getElementById('reset')) b.onclick=function(){ if(confirm('Wipe all players, answers and scores for room '+ROOM+'?')){ base.remove().then(function(){ setState({phase:'lobby',qIndex:-1}); }); } };
    if(b=document.getElementById('resume')) b.onclick=function(){ try{STATMusic.start();}catch(e){}
      var ph=state.phase, secs=ph==='question'?QSEC:ph==='reveal'?REVEAL_SEC:ph==='sudden'?SDSEC:ph==='sudden_reveal'?3:6;
      clearAuto(); setState({paused:false, endsAt:now()+secs*1000}); };
    if(b=document.getElementById('restart')) b.onclick=function(){ if(confirm('Throw away the game in progress and go back to the waiting page? Players stay checked in.')) newGame(false); };
    if(b=document.getElementById('newgame')) b.onclick=function(){ newGame(true); };
    if(b=document.getElementById('sdgo')) b.onclick=function(){ clearAuto(); setState({phase:'sudden', sdIndex:0, endsAt:now()+SDSEC*1000}); };
  if(b=document.getElementById('music')) b.onclick=function(){ STATMusic.toggle(); render(); };
  if(b=document.getElementById('copy')) b.onclick=function(){ navigator.clipboard&&navigator.clipboard.writeText(playerURL); b.textContent='Copied ✓'; setTimeout(function(){b.textContent='Copy link';},1500); };
  }

  function drawQR(){ var el=document.getElementById('qr'); if(!el)return; el.innerHTML=''; try{ new QRCode(el,{text:playerURL,width:180,height:180,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.innerHTML='<div style="color:#333;font-size:12px;text-align:center;padding:8px">QR unavailable —<br>use the link/code</div>'; } }

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var confettiDone=false;
  function confetti(){ if(confettiDone)return; confettiDone=true; if(matchMedia('(prefers-reduced-motion: reduce)').matches)return; var c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;var ps=[];for(var i=0;i<200;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,w:6+Math.random()*8,h:8+Math.random()*10,a:Math.random()*6,s:Math.random()*.2-.1,col:['#F5A524','#2FBF8F','#E4F2EC','#E4573D'][i%4]});var t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(function(p){p.y+=p.v;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});if(++t<280)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})(); }
})();
</script>
</body>
</html>
