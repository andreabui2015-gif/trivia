<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Pharmacists Day Trivia</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2A1206;--ink2:#3E1D0C;--mint:#FBEFD2;--dim:#C9A87E;--amber:#F0A828;--amberd:#C8371F;--label:#FBEFD2;--link:#2A1206;--alert:#C8371F;--ok:#2E7D5B;--disp:"Barlow Condensed",Arial,sans-serif;--body:"Barlow",Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{background:var(--ink);color:var(--mint);font-family:var(--body);background-image:radial-gradient(circle at 18% 6%,rgba(240,168,40,.20) 0,transparent 42%),radial-gradient(circle at 84% 24%,rgba(200,55,31,.16) 0,transparent 44%),linear-gradient(170deg,#3E1D0C 0%,var(--ink) 55%,#1B0B03 100%);padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px)}
  body::before{content:'';position:fixed;inset:-240px;pointer-events:none;z-index:0;background-image:var(--bgtile);
    background-size:240px 240px;animation:drift 70s linear infinite}
  @keyframes drift{to{transform:translate(240px,240px)}}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(20,8,2,.55) 100%)}
  /* stickers */
  .stk{display:inline-block;filter:drop-shadow(2px 4px 3px rgba(0,0,0,.45));pointer-events:none;user-select:none}
  .stk svg{width:100%;height:100%;display:block}
  .bob{animation:bob 3.2s ease-in-out infinite}
  .bob.b2{animation-duration:3.8s;animation-delay:-1.1s}.bob.b3{animation-duration:2.9s;animation-delay:-2s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-7px) rotate(calc(var(--r,0deg) + 4deg))}}
  #stkLayer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  #stkLayer .stk{position:absolute}
  .strip{display:flex;justify-content:space-around;align-items:center;height:62px;position:relative;z-index:1;pointer-events:none}
  .strip .stk{width:52px;height:52px}
  #reward{position:fixed;right:10px;bottom:84px;z-index:50;pointer-events:none;text-align:center}
  #reward .stk{display:block;width:96px;height:96px;animation:popin .9s cubic-bezier(.2,1.6,.4,1) both}
  #reward .cap{display:inline-block;font-family:var(--disp);font-weight:800;font-size:24px;color:#FBEFD2;background:#2A1206;
    border:3px solid #F0A828;border-radius:999px;padding:6px 18px;margin-top:2px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.45);
    animation:popin .9s .08s cubic-bezier(.2,1.6,.4,1) both}
  #reward.out{animation:floatout .6s ease-in forwards}
  @keyframes popin{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
  @keyframes floatout{to{transform:translate(-50%,-110%);opacity:0}}
  .winstk{display:flex;justify-content:center;gap:10px;margin:4px 0 2px}.winstk .stk{width:56px;height:56px}
  @media (max-height:720px){ #stkBot{display:none} .strip{height:48px} .strip .stk{width:40px;height:40px} }
  @media (prefers-reduced-motion:reduce){ body::before,.bob,#reward .stk,#reward .cap{animation:none!important} }
  .app{position:relative;z-index:2;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 10px}
  header   header .logo{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:800;font-size:26px;color:var(--amber);letter-spacing:-.01em}
  .rxlogo{width:26px;height:26px;color:var(--amber);flex:none}
  .checkband{height:12px;width:100%;
    background-image:linear-gradient(45deg,var(--amberd) 25%,transparent 25%,transparent 75%,var(--amberd) 75%),
                     linear-gradient(45deg,var(--amberd) 25%,transparent 25%,transparent 75%,var(--amberd) 75%);
    background-size:12px 12px;background-position:0 0,6px 6px;border-radius:99px;margin-bottom:14px;opacity:.9}
  header .me{font-family:var(--disp);font-size:16px;color:var(--dim);text-align:right;line-height:1.1}
  header .me b{display:block;color:var(--mint);font-size:19px}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:6px 0 20px}
  .card{background:var(--label);color:var(--link);border-radius:16px;padding:22px 20px;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 3px var(--amber)}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(34px,9vw,48px);line-height:.98;margin-bottom:8px;text-transform:uppercase;letter-spacing:-.01em}
  h1 .h1sub{display:inline-block;background:var(--amberd);color:#fff;padding:2px 12px 4px;border-radius:8px;
    transform:rotate(-1.2deg);box-shadow:3px 3px 0 var(--link);font-size:.82em;margin-top:5px}
  .sub{color:#7A5A38;font-size:15.5px;line-height:1.4;margin-bottom:16px}
  label{display:block;font-family:var(--disp);font-weight:700;font-size:15px;color:var(--amberd);letter-spacing:.03em;margin-bottom:6px}
  input{width:100%;border:2px solid #D9C89A;border-radius:12px;padding:14px;font-size:20px;font-family:var(--body);color:var(--link);background:#fff}
  input:focus{outline:none;border-color:var(--amber)}
  button.go{width:100%;margin-top:16px;border:none;border-radius:12px;padding:16px;font-family:var(--disp);font-weight:800;font-size:22px;background:var(--amber);color:var(--link);letter-spacing:.02em}
  button.go:disabled{opacity:.5}
  .note{color:var(--dim);font-size:13px;text-align:center;margin-top:14px}
  .badge{display:inline-block;background:var(--ink);color:var(--amber);font-family:var(--disp);font-weight:700;border-radius:999px;padding:5px 14px;font-size:13.5px;margin-bottom:12px;letter-spacing:.02em}

  /* question */
  .qmeta{display:flex;justify-content:space-between;font-family:var(--disp);color:var(--amberd);font-size:15px;border-bottom:2px dashed #E7C97D;padding-bottom:8px;margin-bottom:12px}
  .prompt{font-family:var(--disp);font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.1;margin-bottom:12px}
  .tray{background:#EAF0EC;border-radius:12px;box-shadow:inset 0 0 0 5px #C9D6CF;padding:6px;margin-bottom:12px}
  .tray svg{width:100%;height:auto;display:block}
  .mock{display:grid;gap:10px;margin-bottom:12px}.mock.single{grid-template-columns:1fr}
  @media(min-width:460px){.mock:not(.single){grid-template-columns:1fr 1fr}}
  .cardm{background:#fff;border:2px solid #B9AE8E;border-radius:8px;padding:10px 11px;font-family:"Courier New",monospace;color:#111;font-size:13px;line-height:1.4}
  .cardm h4{font-family:var(--disp);font-size:14px;color:var(--amberd);margin-bottom:4px;letter-spacing:.03em}
  .cardm .bar{height:14px;margin-top:8px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 9px,#111 9px 12px,#fff 12px 14px)}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid #E4D6AA;border-radius:12px;padding:15px 14px;margin-bottom:10px;font-family:var(--disp);font-weight:700;font-size:19px;color:var(--link);line-height:1.15;transition:transform .06s,background .15s,border-color .15s}
  .opt:active{transform:scale(.985)}
  .opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--link);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
  .opt.chosen{background:var(--amber);border-color:var(--amberd)}
  .opt.correct{background:var(--ok);border-color:#1E9C72;color:#fff}.opt.correct .k{background:#fff;color:var(--ok)}
  .opt.wrong{background:#F3D9D3;border-color:var(--alert);color:#7A2418}
  .opt:disabled{cursor:default}
  .wager{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}
  .wager button{min-width:0;border:2px solid #E4D6AA;background:#fff;border-radius:12px;padding:14px 0;font-family:var(--disp);font-weight:800;font-size:22px;color:var(--link)}
  .wager button.sel{background:var(--amber);border-color:var(--amberd)}
  @media (max-width:370px){ .wager{grid-template-columns:repeat(3,1fr)} }
  .timer{height:8px;border-radius:99px;background:#E4D6AA;overflow:hidden;margin-bottom:14px}
  .timer i{display:block;height:100%;background:var(--amber);width:100%;transition:width 1s linear}
  .timer i.low{background:var(--alert)}

  /* status blocks */
  .big{font-family:var(--disp);font-weight:800;font-size:clamp(32px,10vw,52px);line-height:1;text-align:center}
  .center{text-align:center}
  .score-row{display:flex;justify-content:space-around;margin-top:14px;gap:10px}
  .stat{background:var(--ink);border-radius:12px;padding:12px;flex:1;text-align:center}
  .stat b{display:block;font-family:var(--disp);font-size:30px;color:var(--amber);line-height:1}
  .stat span{font-size:12px;color:var(--dim)}
  .verdict{border-radius:12px;padding:14px;text-align:center;font-family:var(--disp);font-weight:800;font-size:26px;margin-bottom:10px}
  .verdict.yes{background:var(--ok);color:#062;} .verdict.no{background:#F3D9D3;color:#7A2418}
  .fact{font-size:14px;color:#6B5A2E;line-height:1.4;margin-top:4px}
  .pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
  .medal{font-size:44px}
  .lockmsg{margin-top:4px;text-align:center;font-size:14px;color:#9A7A52;padding:8px;border-radius:10px}
  .lockmsg.on{background:var(--link);color:var(--amber);font-family:var(--disp);font-weight:700;font-size:15px}
  .opt.chosen{box-shadow:0 0 0 3px var(--amberd) inset,0 4px 0 var(--amberd);background:#FFF1D0}
  /* quips */
  .quip{display:flex;gap:10px;align-items:center;text-align:left;border-radius:14px;padding:10px 12px;margin:-2px 0 12px;
    font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.2;animation:qin .45s cubic-bezier(.2,1.4,.4,1) both}
  .quip .qstk{flex:none;width:44px;height:44px;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.3))}
  .quip .qstk svg{width:100%;height:100%;display:block}
  .quip.q-right{background:#E3F4EC;color:#1F5A40;border:2px solid #2E7D5B}
  .quip.q-wrong{background:#FCE6E1;color:#8A2A18;border:2px solid #E4573D}
  .quip.q-none{background:#FFF1D6;color:#6B4A12;border:2px solid #F0A828}
  @keyframes qin{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  /* final scoreboard */
  .mypos{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 10px;background:var(--link);color:#FBEFD2;
    border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:4px 4px 0 var(--amber)}
  .mypos span:first-child{text-align:left;font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--amber)}
  .mypos b{font-family:var(--disp);font-weight:800;font-size:34px;color:#fff;line-height:1}
  .mypos span:last-child{text-align:right}
  .bhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px;font-family:var(--disp);font-weight:800;
    font-size:16px;color:var(--amberd);text-transform:uppercase;letter-spacing:.04em}
  .findme{border:2px solid var(--amberd);background:#fff;color:var(--amberd);border-radius:999px;padding:4px 12px;font-family:var(--disp);font-weight:800;font-size:14px}
  .board{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:left;border:2px solid #E7C97D;border-radius:12px;background:#fff;scroll-behavior:auto}
  .brow{display:grid;grid-template-columns:44px 1fr auto 44px;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid #F1E6C8;font-size:15px}
  .brow:last-child{border-bottom:0}
  .brow .bk{font-family:var(--disp);font-weight:800;font-size:16px;color:#9A7A52;text-align:center}
  .brow.top .bk{font-size:20px}
  .brow .bn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow .bn em{font-style:normal;font-family:var(--disp);font-weight:800;font-size:12px;background:var(--amberd);color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
  .brow .bc{font-size:12px;color:#9A7A52}
  .brow .bs{font-family:var(--disp);font-size:19px;text-align:right;color:var(--link)}
  .brow.me{background:var(--amber);position:sticky;top:0;bottom:0;z-index:1;box-shadow:0 0 0 3px var(--amberd) inset}
  .brow.me .bk,.brow.me .bc{color:var(--link)}
  .brow.flash{animation:flash .9s ease-in-out 2}
  @keyframes flash{50%{background:#FFE082}}
  /* waiting page */
  .howto{text-align:left;background:#fff;border:2px solid #E7C97D;border-radius:12px;padding:12px 14px;margin-top:4px}
  .howto h3{font-family:var(--disp);font-weight:800;font-size:17px;color:var(--amberd);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 6px}
  .howto .rulelist{margin-bottom:8px}.howto .rulelist li{font-size:14px}
  .rounds{list-style:none;margin:0;padding:0;counter-reset:rd}
  .rounds li{counter-increment:rd;display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed #EAD9AE;font-size:14px;line-height:1.25}
  .rounds li:last-child{border-bottom:0}
  .rounds .ri{flex:none;width:20px;font-size:15px}
  .rounds b{font-family:var(--disp);font-size:16px;color:var(--link)}.rounds b:before{content:counter(rd) ". ";color:var(--amberd)}
  .rounds .rs{color:#7A5A38;font-size:13px}
  /* music button */
  header{position:relative}
  .mbtn{margin-left:auto;margin-right:10px;background:transparent;border:1.5px solid #6B4A2A;color:var(--dim);border-radius:999px;
    padding:4px 11px;font-family:var(--disp);font-weight:700;font-size:13px;cursor:pointer}
  .mbtn.on{border-color:var(--amber);color:var(--amber)}
  .mbtn.nudge{border-color:var(--amber);color:#2A1206;background:var(--amber);animation:nud 1.2s ease-in-out infinite}
  @keyframes nud{50%{transform:scale(1.08)}}
  /* countdown number */
  .secs{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--amberd);min-width:1.4ch;text-align:right;display:inline-block;transition:transform .15s}
  /* ---------- pressure: red closes in, card shakes harder every second ---------- */
  #press{position:fixed;inset:0;pointer-events:none;z-index:40;transition:box-shadow .3s}
  body.press1 #press{box-shadow:inset 0 0 40px rgba(228,87,61,.30)}
  body.press2 #press{box-shadow:inset 0 0 60px rgba(228,87,61,.45)}
  body.press3 #press{box-shadow:inset 0 0 85px rgba(228,87,61,.60)}
  body.press4 #press{box-shadow:inset 0 0 110px rgba(228,87,61,.72);animation:pulseg .5s ease-in-out infinite}
  body.press5 #press{box-shadow:inset 0 0 150px rgba(228,87,61,.88);animation:pulseg .3s ease-in-out infinite}
  @keyframes pulseg{50%{opacity:.55}}
  /* shake the timer + Rx header ONLY - answer buttons never move, so nobody mis-taps under pressure */
  body.press3 .filling,body.press3 .rxhead{animation:shk .5s ease-in-out infinite}
  body.press4 .filling,body.press4 .rxhead{animation:shk .28s ease-in-out infinite}
  body.press5 .filling,body.press5 .rxhead{animation:shk2 .16s ease-in-out infinite}
  @keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
  @keyframes shk2{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,2px) rotate(-.5deg)}75%{transform:translate(3px,-2px) rotate(.5deg)}}
  body[class*=press] .secs{color:var(--alert)}
  body.press3 .secs{transform:scale(1.3)} body.press4 .secs{transform:scale(1.55)} body.press5 .secs{transform:scale(1.8)}
  body[class*=press] #fillab{color:var(--alert)}
  body[class*=press] .filling .cdbar i{background:var(--alert)}
  body.press4 .filling .cdbar,body.press5 .filling .cdbar{animation:pulseg .3s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){ body[class*=press] .filling,body[class*=press] .rxhead,body[class*=press] #press,body[class*=press] .cdbar{animation:none!important} }
  .rxhead{border-bottom:2px dashed #E7C97D;padding-bottom:8px;margin-bottom:12px;font-family:var(--disp)}
  .rxtop{display:flex;justify-content:space-between;align-items:baseline}
  .rxno{font-weight:800;font-size:17px;color:var(--amberd);letter-spacing:.03em}
  .rxof{font-size:14px;color:#9A7A52}
  .rxrow{display:flex;justify-content:space-between;font-size:14px;color:#6B4A28;margin-top:2px}
  .rxrow b{color:var(--link)}
  .filling{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .filling span{font-family:var(--disp);font-weight:700;font-size:13px;color:#9A7A52;letter-spacing:.04em;text-transform:uppercase}
  .filling .cdbar{flex:1;margin:0;height:14px;border:2px solid var(--link);border-radius:99px;background:#fff}
  .filling .cdbar i{background:linear-gradient(90deg,var(--amberd) 0 50%,var(--amber) 50% 100%)}
  .bottle{width:74px;height:100px;margin:4px auto 6px;display:block}
  .pillsfall{animation:shake 1.4s ease-in-out infinite;transform-origin:40px 90px}
  @keyframes shake{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px) rotate(-2deg)}75%{transform:translateY(-2px) rotate(2deg)}}
  .rtitle{text-align:center;font-size:14px;color:#7A5A38;margin-top:10px}
  .rtitle b{color:var(--amberd);font-family:var(--disp);font-size:16px}
  .rxlabel{margin:12px 0 6px;background:#fff;border:2px solid var(--link);border-radius:8px;padding:10px 12px;
    font-family:"Courier New",monospace;color:#111;text-align:left;box-shadow:4px 4px 0 var(--amberd)}
  .rxl-top{display:flex;justify-content:space-between;font-size:10px;font-weight:700;border-bottom:1px solid #111;padding-bottom:4px;margin-bottom:6px}
  .rxl-pt{font-size:12px}
  .rxl-drug{font-family:var(--disp);font-weight:800;font-size:24px;color:var(--amberd);margin:4px 0}
  .rxl-sig{font-size:12px}
  .rxl-foot{display:flex;justify-content:space-between;font-size:11px;border-top:1px dashed #111;margin-top:6px;padding-top:4px}
  .rulelist{list-style:none;margin:2px 0 16px;padding:0}
  .rulelist li{position:relative;padding-left:20px;font-size:15px;line-height:1.35;color:#3A2C10;margin-bottom:7px}
  .rulelist li:before{content:"";position:absolute;left:4px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .rulelist b{color:var(--link)}
  .musicopt{display:flex;align-items:center;gap:9px;margin-top:12px;font-family:var(--body);font-size:14.5px;color:#3A2C10;font-weight:600}
  .musicopt input{width:auto;margin:0}
  .cdbar{height:10px;border-radius:99px;background:#E4D6AA;overflow:hidden;margin-bottom:12px}
  .cdbar i{display:block;height:100%;width:100%;background:var(--amber);transition:width .2s linear}
  .cdbar i.low{background:var(--alert)}
  .sdbanner{background:var(--alert);color:#fff;border-radius:12px;padding:12px;text-align:center;
    font-family:var(--disp);font-weight:800;font-size:22px;margin-bottom:12px;letter-spacing:.02em}
  .musicbtn{position:absolute;right:0;top:-2px;background:transparent;border:1px solid #3A5A52;color:var(--dim);
    border-radius:999px;padding:3px 10px;font-size:12px;font-family:var(--disp);font-weight:700}
  .prizewin{margin:10px 0 4px;background:var(--amber);color:var(--link);border-radius:12px;padding:12px;
    font-family:var(--disp);font-weight:800;font-size:22px;box-shadow:0 6px 16px rgba(0,0,0,.22)}
</style>
</head>
<body>
<div id="stkLayer"></div>
<div id="press"></div>
<div class="app">
  <header>
    <div class="logo"><svg class="rxlogo" viewBox="0 0 100 100" aria-hidden="true"><path d="M20 46 H80 C80 68 68 80 50 80 C32 80 20 68 20 46 Z" fill="currentColor"/><rect x="16" y="40" width="68" height="9" rx="4.5" fill="currentColor"/><rect x="44" y="82" width="12" height="6" rx="3" fill="currentColor"/><path d="M58 38 L78 14" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><circle cx="80" cy="12" r="7" fill="currentColor"/></svg><span>STAT!</span></div>
    <button class="mbtn" id="mbtn" aria-label="Music on/off">&#9835;</button>
    <div class="me" id="me"></div>
  </header>
  <div class="strip" id="stkTop"></div>
  <main id="main"><div class="center pulse" style="margin:auto;color:var(--dim);font-family:var(--disp);font-size:20px">Connecting…</div></main>
  <div class="strip" id="stkBot"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="game-core.js"></script>
<script src="music.js"></script>
<script>
(function(){
  var main=document.getElementById('main'), meEl=document.getElementById('me');
  var SET={};  // timing published by the host (overrides config.js when the host uses ?qsec=)
  function QS(){ return +(SET.qsec||CFG.questionSeconds||10); }
  function SDS(){ return +(SET.sdsec||CFG.suddenDeathSeconds||5); }
  function wantMusic(){ return localStorage.getItem('stat_music')!=='0'; }
  ['pointerdown','touchend','click','keydown'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(e.target && e.target.closest && e.target.closest('#mbtn')) return;
      if(!name || !wantMusic()) return;
      try{ if(!STATMusic.isOn()) { STATMusic.start(); musicBtn(); } else STATMusic.arm(); }catch(err){}
    },{capture:true,passive:true});
  });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && wantMusic()){ try{ STATMusic.arm(); }catch(e){} setTimeout(musicBtn,300); } });
  document.getElementById('mbtn').onclick=function(){ try{ var on=STATMusic.toggle(); localStorage.setItem('stat_music',on?'1':'0'); }catch(e){} musicBtn(); };
  /* ---------- stickers ---------- */
  function stk(name,size,cls,rot){ return '<span class="stk '+(cls||'')+'" style="width:'+size+'px;height:'+size+'px;--r:'+(rot||0)+'deg;transform:rotate('+(rot||0)+'deg)">'+STAT.STICKERS[name]+'</span>'; }
  (function decorate(){
    try{
      document.documentElement.style.setProperty('--bgtile','url("'+STAT.BG_TILE+'")');
      // peeking stickers behind the card (z-index below content, never blocks taps)
      var L=[['capsule',78,'top:13%;left:-22px',-18,'b2'],['heart',64,'top:30%;right:-18px',14,''],['bottle',72,'top:52%;left:-24px',10,'b3'],
             ['rx',66,'top:70%;right:-20px',-12,'b2'],['nacho',70,'bottom:4%;left:-16px',16,''],['blister',66,'bottom:10%;right:-22px',-8,'b3']];
      document.getElementById('stkLayer').innerHTML=L.map(function(x){
        return '<span class="stk bob '+x[4]+'" style="width:'+x[1]+'px;height:'+x[1]+'px;'+x[2]+';--r:'+x[3]+'deg">'+STAT.STICKERS[x[0]]+'</span>';}).join('');
      document.getElementById('stkTop').innerHTML=stk('mortar',52,'bob',-10)+stk('happy',58,'bob b2',8)+stk('capsule',52,'bob b3',-6)+stk('stat',54,'bob',6);
      document.getElementById('stkBot').innerHTML=stk('tablet',50,'bob b3',6)+stk('verified',54,'bob',-8)+stk('heart',50,'bob b2',10)+stk('bandaid',52,'bob',-6);
    }catch(e){}
  })();
  var GOOD=[['verified','Verified by RPh!'],['happy','Nailed it!'],['heart','Love that for you'],['stat','STAT genius!'],['capsule','Refill that brain!'],['mortar','Compounded perfectly']];
  var BAD=[['bandaid','Walk it off!'],['tablet','Take two & try again'],['blister','Next dose, champ']];
  function reward(ok){
    try{
      if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var pick=(ok?GOOD:BAD)[Math.floor(Math.random()*(ok?GOOD:BAD).length)];
      var old=document.getElementById('reward'); if(old) old.remove();
      var d=document.createElement('div'); d.id='reward';
      d.innerHTML='<span class="stk">'+STAT.STICKERS[pick[0]]+'</span>';
      document.body.appendChild(d);
      setTimeout(function(){ d.classList.add('out'); },1250);
      setTimeout(function(){ if(d.parentNode) d.remove(); },1900);
    }catch(e){}
  }
  var CFG=window.STAT_CONFIG||{};
  var params=new URLSearchParams(location.search);
  var ROOM=(params.get('g')||CFG.room||'PARTY').toUpperCase();

  // identity persists across refresh
  var pid=localStorage.getItem('stat_pid'); if(!pid){pid='p_'+Math.random().toString(36).slice(2,9);localStorage.setItem('stat_pid',pid);}
  var name=localStorage.getItem('stat_name_'+ROOM)||'';

  // firebase
  var db=null, connected=false;
  try{ firebase.initializeApp(CFG.firebase); db=firebase.database(); connected=true; }
  catch(e){ renderFatal('This game link isn\'t set up yet. The host needs to finish the one-time setup (see README).'); }
  if(!db) return;

  var base=db.ref('rooms/'+ROOM);
  var OFF=0; try{ db.ref('.info/serverTimeOffset').on('value',function(s){ OFF=+(s.val()||0); }); }catch(e){}
  function now(){ return Date.now()+OFF; }
  base.child('settings').on('value',function(s){ SET=s.val()||{};
    setTimeout(function(){   // async + in-place: never wipes a half-typed name, never runs before the page is ready
      var a=document.getElementById('jq'), b=document.getElementById('jsd'); if(a) a.textContent=QS(); if(b) b.textContent=SDS();
      if(name && typeof draw==='function') { try{ draw(); }catch(e){} }
    },0); });
  // stopwatch starts the FIRST time this phone shows a question - redraws caused by other players must not reset it
  var shownAt={};
  function markShown(key){ if(!shownAt[key]) shownAt[key]=Date.now(); return shownAt[key]; }
  var state={phase:'lobby',qIndex:-1}, players={}, scores={}, myAnswers={}, sdMine={}, sdAll={}, allAns={};
  var qShownAt=0, pickedWager=null, lowTimer=null;

  function renderFatal(msg){ main.innerHTML='<div class="card center"><h1>Hmm.</h1><div class="sub">'+msg+'</div></div>'; }

  // ---------- JOIN ----------
  function renderJoin(){
    meEl.textContent='';
    main.innerHTML=
      '<div class="card">'+
        '<div class="checkband"></div>'+
        '<div class="badge">&#127881; World Pharmacists Day &middot; Room '+ROOM+'</div>'+
        '<h1>Pharmacy Trivia<br><span class="h1sub">Celebration Game</span></h1>'+
        '<div class="sub">20 questions. Tap your answer on your phone. Pharmacists, techs and interns &mdash; everyone plays.</div>'+
        '<ul class="rulelist">'+
          '<li><b><span id="jq">'+QS()+'</span> seconds</b> per question &mdash; it moves on automatically, so answer fast.</li>'+
          '<li><b>Faster = better.</b> Ties are broken by who answered quickest.</li>'+
          '<li><b>Sudden death</b> if anyone is still tied: 5 questions, <span id="jsd">'+SDS()+'</span> seconds each.</li>'+
          '<li><b>Prizes</b> for 1st, 2nd and 3rd place.</li>'+
        '</ul>'+
        '<label for="nm">Your name (players will see this)</label>'+
        '<input id="nm" maxlength="24" autocomplete="name" placeholder="e.g. Aisha, tech" value="'+esc(name)+'">'+
        '<div class="musicopt">&#128266; Music plays on your phone &mdash; turn your volume up! (Tap &#9835; at the top to mute.)</div>'+
        '<button class="go" id="join">Join the game</button>'+
        '<div class="note">&#127881; Happy World Pharmacists Day &mdash; good luck!</div>'+
      '</div>';
    var input=document.getElementById('nm');
    document.getElementById('join').onclick=doJoin;
    input.addEventListener('keydown',function(e){if(e.key==='Enter')doJoin();});
    input.focus();
  }
  function doJoin(){
    var v=document.getElementById('nm').value.trim().slice(0,24);
    if(!v){document.getElementById('nm').focus();return;}
    var wantMusic=localStorage.getItem('stat_music')!=='0';
    try{ STATMusic.arm(); STATMusic.setSong('lobby'); if(wantMusic) STATMusic.start(); }catch(e){} setTimeout(musicBtn,50);
    name=v; localStorage.setItem('stat_name_'+ROOM,name);
    base.child('players/'+pid).update({name:name,joinedAt:firebase.database.ServerValue.TIMESTAMP});
    base.child('players/'+pid+'/online').onDisconnect().set(false);
    base.child('players/'+pid+'/online').set(true);
    listen();
  }

  // ---------- LIVE ----------
  function listen(){
    base.child('state').on('value',function(s){ state=s.val()||{phase:'lobby',qIndex:-1}; draw(); });
    base.child('players').on('value',function(s){ players=s.val()||{}; draw(); });
    base.child('sudden').on('value',function(s){ sdAll=s.val()||{}; sdMine={}; Object.keys(sdAll).forEach(function(k){ if(sdAll[k]&&sdAll[k][pid])sdMine[k]=sdAll[k][pid]; }); draw(); });
    base.child('answers').on('value',function(s){ var a=s.val()||{}; allAns=a; myAnswers={}; Object.keys(a).forEach(function(qk){ if(a[qk]&&a[qk][pid])myAnswers[qk]=a[qk][pid]; }); scores=STAT.computeScores(players,a); draw(); });
    draw();
  }

  var TITLES=['Pill Counting Prodigy','Label Legend','Capsule Captain','Tablet Titan','Vial Virtuoso','Sig Code Savant','Blister Pack Boss','Refill Royalty'];
  function titleFor(rank){ return TITLES[(Math.max(1,rank)-1)%TITLES.length]; }
  function setSong(k){ try{ STATMusic.setSong(k); }catch(e){} }
  var vTimer=null;   // victory music plays ~20s on phones, then goes quiet (battery + sanity)
  function victoryStop(arm){ clearTimeout(vTimer); vTimer=null; if(arm) vTimer=setTimeout(function(){ try{STATMusic.stop(); musicBtn();}catch(e){} },20000); }
  /* ---------- last-5-seconds pressure: one level per second ---------- */
  var pressLvl=0;
  setInterval(pressTick,120);
  function pressTick(){
    var ph=state.phase, lvl=0;
    if(!state.paused && (ph==='question'||ph==='sudden') && state.endsAt){
      var left=state.endsAt-now(); if(left>0 && left<=5000) lvl=Math.min(5, 6-Math.ceil(left/1000));
      var sec=document.getElementById('secs'); if(sec) sec.textContent=Math.max(0,Math.ceil(left/1000));
    }
    if(lvl!==pressLvl){ var up=lvl>pressLvl; pressLvl=lvl;
      document.body.className=document.body.className.replace(/\bpress\d\b/g,'').trim()+(lvl?' press'+lvl:'');
      try{STATMusic.setPressure(lvl);}catch(e){}
      if(up && lvl && navigator.vibrate && localStorage.getItem('stat_music')!=='0'){ try{navigator.vibrate(lvl>=4?[60,40,60]:40+lvl*15);}catch(e){} }
      var lab=document.getElementById('fillab'); if(lab) lab.textContent=lvl>=3?'HURRY!':'Filling…';
    }
  }
  /* ---------- music button (needed after a page reload: phones only allow sound after a tap) ---------- */
  function musicBtn(){ var b=document.getElementById('mbtn'); if(!b) return;
    var want=localStorage.getItem('stat_music')!=='0', on=false; try{on=STATMusic.isOn();}catch(e){}
    b.textContent=on?'♫ On':'♫ Off'; b.className='mbtn'+(on?' on':(want?' nudge':'')); }
  function myRank(){ var r=STAT.rankPlayers(players,scores).find(function(x){return x.pid===pid;}); return r||{rank:'—',score:0}; }

  function draw(){
    musicBtn(); pressTick();
    if(!name){ renderJoin(); return; }
    var r=myRank();
    meEl.innerHTML='<span>'+esc(name)+'</span><b>'+r.score+' pts · #'+r.rank+'</b>';
    var phase=state.phase, qi=state.qIndex;
    var q=(qi>=0&&qi<STAT.QUESTIONS.length)?STAT.QUESTIONS[qi]:null;

    var MID={question:1,reveal:1,sudden_intro:1,sudden:1,sudden_reveal:1};
    if(state.paused && MID[phase]){ setSong('lobby'); drawPaused(); return; }
    if(phase==='lobby'){
      setSong('lobby'); victoryStop();
      var n=Object.keys(players).length;
      main.innerHTML='<div class="card center"><div class="checkband"></div><div class="badge">Rx received &middot; Room '+ROOM+'</div>'+
        '<svg class="bottle" viewBox="0 0 80 110" aria-hidden="true"><rect x="14" y="4" width="52" height="16" rx="4" fill="#F7F3EA" stroke="#2A1206" stroke-width="3"/><rect x="10" y="20" width="60" height="84" rx="10" fill="#E89A2C" fill-opacity=".35" stroke="#2A1206" stroke-width="3"/><rect x="18" y="42" width="44" height="30" rx="3" fill="#FBEFD2" stroke="#2A1206" stroke-width="2"/><text x="40" y="62" text-anchor="middle" font-family="Arial" font-weight="700" font-size="14" fill="#C8371F">Rx</text><g class="pillsfall"><circle cx="30" cy="94" r="5" fill="#fff"/><circle cx="44" cy="96" r="5" fill="#fff"/><circle cx="52" cy="90" r="5" fill="#C8371F"/><circle cx="38" cy="86" r="5" fill="#fff"/></g></svg>'+
        '<h1>You\'re in!</h1><div class="sub">Your order is in the queue. The pharmacist (host) starts the game shortly. <b>'+n+'</b> player'+(n===1?'':'s')+' checked in so far.</div>'+
        '<div class="big pulse" style="color:var(--amberd);margin:2px 0 10px">Now filling&hellip;</div>'+rulesCard()+'</div>';
      return;
    }
    if(phase==='ended'){ setSong('victory'); victoryStop(true); drawFinal(); return; }
    if(phase==='sudden_intro'){ try{STATMusic.setMode('sudden');}catch(e){} drawSuddenIntro(); return; }
    if(phase==='sudden'||phase==='sudden_reveal'){ try{STATMusic.setMode('sudden');}catch(e){} drawSudden(phase); return; }
    if(!q){ main.innerHTML='<div class="card center pulse">…</div>'; return; }

    setSong(STATMusic.songForRound(q.roundId));
    var mine=myAnswers[q.key];
    if(phase==='question'){
      if(!main.querySelector('[data-qv="'+q.key+'"]')) drawQuestion(q);   // already showing -> leave the buttons alone (no eaten taps)
      markChoice(q, mine);
    } else if(phase==='reveal'){
      if(window._lastBell!==q.key){ window._lastBell=q.key; if(localStorage.getItem('stat_music')!=='0'){ try{STATMusic.sting('bell');}catch(e){} } if(mine) reward(mine.choice===q.answer); }
      drawReveal(q,mine);
    }
  }

  function rxNum(q){ var i=STAT.QUESTIONS.indexOf(q); return '0925-'+String(i+1).padStart(2,'0'); }
  function qmeta(q){
    var i=STAT.QUESTIONS.indexOf(q)+1;
    return '<div class="rxhead"><div class="rxtop"><span class="rxno">Rx #'+rxNum(q)+'</span><span class="rxof">'+i+' of '+STAT.QUESTIONS.length+'</span></div>'+
      '<div class="rxrow"><span><b>Sig:</b> '+esc(q.roundName)+'</span><span><b>Qty:</b> '+(q.isWager?'wager 0–5':q.pts+' pt'+(q.pts>1?'s':''))+'</span></div></div>';
  }

  function drawQuestion(q){
    qShownAt=markShown(q.key); var prev=myAnswers[q.key]; pickedWager=(q.isWager?(prev&&prev.wager!=null?prev.wager:(pickedWager||0)):null);
    var html='<div class="card" data-qv="'+q.key+'">'+qmeta(q);
    html+='<div class="filling"><span id="fillab">Filling&hellip;</span><div class="cdbar"><i id="bar"></i></div><b id="secs" class="secs">'+QS()+'</b></div>';
    html+='<div class="prompt">'+esc(q.prompt)+'</div>';
    html+=STAT.extraHTML(q).replace(/<div class="mock/g,'<div class="mock').replace(/class="card"/g,'class="cardm"');
    if(q.isWager){
      html+='<label>1. Your wager</label><div class="wager" id="wg">'+[0,1,2,3,4,5].map(function(n){return '<button data-w="'+n+'"'+(n===pickedWager?' class="sel"':'')+'>'+n+'</button>';}).join('')+'</div><label>2. Your answer</label>';
    }
    html+=q.options.map(function(o,i){return '<button class="opt" data-i="'+i+'"><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
    html+='<div class="lockmsg" id="lockmsg">Tap an answer. You can change it until time runs out.</div>';
    html+='</div>';
    main.innerHTML=html;
    if(q.isWager){ Array.prototype.forEach.call(document.querySelectorAll('#wg button'),function(b){ b.onclick=function(){ pickedWager=+b.dataset.w; document.querySelectorAll('#wg button').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); var m=myAnswers[q.key]; if(m) submit(q,m.choice,true); }; }); }
    Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){ b.onclick=function(){ submit(q,+b.dataset.i); }; });
    runBar(QS());
  }
  function runBar(totalSec){
    var bar=document.getElementById('bar'); if(!bar)return;
    var ends=state.endsAt||(now()+totalSec*1000);
    clearInterval(lowTimer);
    lowTimer=setInterval(function(){
      var left=ends-now(), pct=Math.max(0,Math.min(1,left/(totalSec*1000)));
      bar.style.width=(pct*100)+'%';
      if(pct<0.3) bar.classList.add('low');
      if(left<=0) clearInterval(lowTimer);
    },150);
  }
  function safeKey(k){ return String(k).replace(/[.$#\[\]\/]/g,'-'); }
  function submit(q,i,wagerOnly){
    if(state.phase!=='question' || (state.endsAt && now()>state.endsAt)) return;           // time's up: no more changes
    var prev=myAnswers[q.key];
    if(prev && prev.choice===i && !wagerOnly && (!q.isWager || prev.wager===(pickedWager||0))) return;   // same tap again: keep your original speed
    // speed = time of your FINAL answer, so switching late can't win a speed tiebreak
    var rec={choice:i,ms:Date.now()-qShownAt}; if(q.isWager)rec.wager=(pickedWager||0);
    if(prev) rec.changes=(prev.changes||0)+(prev.choice!==i?1:0);
    myAnswers[q.key]=rec; markChoice(q,rec);
    base.child('answers/'+safeKey(q.key)+'/'+pid).set(rec).catch(function(){});
    try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
  }
  function markSd(q,mine){ var bs=main.querySelectorAll('[data-sv="'+q.key+'"] .opt'); if(!bs.length) return;
    Array.prototype.forEach.call(bs,function(b){ b.classList.toggle('chosen', !!mine && +b.dataset.i===mine.choice); });
    var m=document.getElementById('lockmsg'); if(m&&mine){ m.className='lockmsg on'; m.innerHTML='&#9745; Locked in: <b>'+STAT.LETTERS[mine.choice]+'</b> &mdash; tap another to change it'; } }
  function markChoice(q,mine){
    var bs=main.querySelectorAll('[data-qv="'+q.key+'"] .opt'); if(!bs.length) return;
    Array.prototype.forEach.call(bs,function(b){ b.classList.toggle('chosen', !!mine && +b.dataset.i===mine.choice); });
    var m=document.getElementById('lockmsg'); if(!m) return;
    if(mine){ m.className='lockmsg on'; m.innerHTML='&#9745; Locked in: <b>'+STAT.LETTERS[mine.choice]+'</b>'+(q.isWager?' &middot; bet <b>'+(mine.wager||0)+'</b>':'')+' &mdash; tap another to change it'; }
    else { m.className='lockmsg'; m.textContent='Tap an answer. You can change it until time runs out.'; }
  }
  function drawLocked(q,mine){
    clearInterval(lowTimer);
    var html='<div class="card">'+qmeta(q)+'<div class="prompt">'+esc(q.prompt)+'</div>';
    html+=q.options.map(function(o,i){var c=i===mine.choice?' chosen':'';return '<button class="opt'+c+'" disabled data-i="'+i+'"><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
    html+='<div class="verdict" style="background:var(--ink);color:var(--amber)">&#9745; Submitted for verification'+(q.isWager?' · wager '+(mine.wager||0):'')+'</div><div class="center" style="color:var(--dim);font-size:14px">The pharmacist is checking your work&hellip;</div></div>';
    main.innerHTML=html;
  }
  function drawReveal(q,mine){
    clearInterval(lowTimer);
    var got=mine&&mine.choice===q.answer;
    var html='<div class="card">'+qmeta(q);
    html+='<div class="verdict '+(got?'yes':'no')+'">'+(got?(q.isWager?'&#10004; VERIFIED! +'+(mine.wager||0):'&#10004; VERIFIED! +'+q.pts):(mine?(q.isWager?'&#10008; REJECTED &minus;'+(mine.wager||0):'&#10008; REJECTED at verification'):'&#10008; Never dispensed'))+'</div>';
    html+=quipHTML(q,mine,STAT.QUESTIONS,STAT.QUESTIONS.indexOf(q));
    html+=q.options.map(function(o,i){var c=i===q.answer?' correct':(mine&&i===mine.choice?' wrong':'');return '<button class="opt'+c+'" disabled><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
    html+='<div class="fact">'+esc(q.fact)+'</div>';
    var r=myRank();
    html+='<div class="score-row"><div class="stat"><b>'+r.score+'</b><span>points</span></div><div class="stat"><b>#'+r.rank+'</b><span>of '+Object.keys(players).length+'</span></div></div>';
    html+='<div class="rtitle">Current title: <b>'+titleFor(r.rank)+'</b></div>';
    html+='</div>';
    main.innerHTML=html;
  }

  /* ---------- quips: unique per player, never repeat within a game, stable across reloads ---------- */
  function outcome(q,a){ return !a ? 'none' : (a.choice===q.answer ? 'right' : 'wrong'); }
  // Lines are dealt to the WHOLE room at once (every phone computes the same result), so nobody repeats
  // and neighbours never get the same line on the same question. Once shown, a line is saved and never changes.
  function quipCache(){ try{ return JSON.parse(localStorage.getItem('stat_q_'+ROOM+'_'+(state.game||'g'))||'{}'); }catch(e){ return {}; } }
  function quipHTML(q,a,list,upto){
    var cache=quipCache(), sdPids={};
    Object.keys(sdAll||{}).forEach(function(k){ Object.keys(sdAll[k]||{}).forEach(function(p){ sdPids[p]=1; }); });
    if((state.tiedNames||'').indexOf(name)>-1) sdPids[pid]=1;
    var all=Object.keys(players); if(all.indexOf(pid)<0) all.push(pid);
    var d=STAT.dealQuips(list.slice(0,upto+1),
      function(qq,p){ if(p===pid) return (qq.sudden?sdMine:myAnswers)[qq.key]; return ((qq.sudden?sdAll:allAns)[qq.key]||{})[p]; },
      function(qq){ return qq.sudden ? Object.keys(sdPids) : all; },
      ROOM+':'+(state.game||'g'), pid, cache);
    var mineQ=(d[q.key]||{})[pid]; if(!mineQ) return '';
    if(!cache[q.key]){ cache[q.key]=mineQ.line; try{ localStorage.setItem('stat_q_'+ROOM+'_'+(state.game||'g'),JSON.stringify(cache)); }catch(e){} }
    var st={right:'verified',wrong:'bandaid',none:'tablet'}[mineQ.kind];
    return '<div class="quip q-'+mineQ.kind+'"><span class="qstk">'+STAT.STICKERS[st]+'</span><span class="qtx">'+esc(cache[q.key])+'</span></div>';
  }
  function drawSuddenIntro(){
    var iAmIn = (state.tiedNames||'').indexOf(name)>-1;
    main.innerHTML='<div class="card center">'+
      '<div class="sdbanner">&#9889; SUDDEN DEATH &#9889;</div>'+
      '<h1>'+(iAmIn?'You\'re in the tiebreak!':'Tiebreak time')+'</h1>'+
      '<div class="sub">Tied: <b>'+esc(state.tiedNames||'')+'</b></div>'+
      '<div class="sub" style="margin-top:8px">5 pop-culture questions. <b>'+SDS()+' seconds each.</b> Fastest correct answers win. Everyone can play along.</div>'+
      '<div class="big pulse" style="color:var(--amberd);margin-top:6px">Get ready\u2026</div></div>';
  }
  function drawSudden(phase){
    var si=state.sdIndex||0, q=STAT.SUDDEN[si];
    if(!q){ main.innerHTML='<div class="card center pulse">\u2026</div>'; return; }
    var mine=sdMine[q.key], reveal=(phase==='sudden_reveal');
    if(!reveal && main.querySelector('[data-sv="'+q.key+'"]')){ markSd(q,mine); return; }   // already showing -> don't rebuild (no eaten taps)
    var html='<div class="card"'+(!reveal?' data-sv="'+q.key+'"':'')+'>'+
      '<div class="qmeta"><span style="color:var(--alert)">SUDDEN DEATH &middot; '+(si+1)+' of '+STAT.SUDDEN.length+'</span><span>'+SDS()+' sec</span></div>';
    if(!reveal) html+='<div class="cdbar"><i id="bar"></i></div>';
    html+='<div class="prompt">'+esc(q.prompt)+'</div>';
    if(reveal){
      var got=mine&&mine.choice===q.answer;
      html+='<div class="verdict '+(got?'yes':'no')+'">'+(got?'&#10004; VERIFIED':(mine?'&#10008; REJECTED':'&#10008; Never dispensed'))+'</div>';
      if((state.tiedNames||'').indexOf(name)>-1) html+=quipHTML(q,mine,STAT.QUESTIONS.concat(STAT.SUDDEN),STAT.QUESTIONS.length+si);
      html+=q.options.map(function(o,i){var c=i===q.answer?' correct':(mine&&i===mine.choice?' wrong':'');
        return '<button class="opt'+c+'" disabled><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
    } else {
      html+=q.options.map(function(o,i){
        return '<button class="opt" data-i="'+i+'"><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
      html+='<div class="lockmsg" id="lockmsg">Tap an answer. You can change it until time runs out.</div>';
    }
    html+='</div>';
    main.innerHTML=html;
    if(!reveal){
      qShownAt=markShown(q.key);
      Array.prototype.forEach.call(document.querySelectorAll('.opt[data-i]'),function(b){
        b.onclick=function(){
          if(state.phase!=='sudden' || (state.endsAt && now()>state.endsAt)) return;
          var prev=sdMine[q.key]; if(prev && prev.choice===+b.dataset.i) return;
          var rec={choice:+b.dataset.i, ms:Date.now()-qShownAt};
          sdMine[q.key]=rec; markSd(q,rec);
          base.child('sudden/'+q.key+'/'+pid).set(rec).catch(function(){});
        };
      });
      runBar(SDS()); markSd(q,mine);
    }
  }

  function rulesCard(){
    var R=STAT.roundSummary(), ic={pop:'&#127916;',pharm:'&#128138;',wager:'&#127922;'};
    var qs=QS();
    return '<div class="howto"><h3>How to play</h3><ul class="rulelist">'+
      '<li><b>'+qs+' seconds</b> per question &mdash; it moves on by itself. The last 5 seconds get intense!</li>'+
      '<li><b>Changed your mind?</b> Tap another answer any time before the clock runs out. Your last tap counts.</li>'+
      '<li><b>Tap fast.</b> Ties go to whoever locked in their final answer quickest.</li>'+
      '<li><b>Final Wager:</b> 3 questions, bet 0&ndash;5 points on each. Win it or lose it.</li>'+
      '<li><b>Sudden death</b> breaks any tie for the top 3: 5 easy questions, '+SDS()+' seconds each.</li>'+
      '<li><b>Prizes</b> for 1st, 2nd &amp; 3rd.</li></ul>'+
      '<h3>The '+R.length+' rounds</h3><ol class="rounds">'+R.map(function(r){
        return '<li><span class="ri">'+(ic[r.kind]||'&#11088;')+'</span><span><b>'+esc(r.name)+'</b><br><span class="rs">'+esc(r.short)+'</span></span></li>';}).join('')+
      '</ol></div>';
  }
  function drawPaused(){
    main.innerHTML='<div class="card center"><div class="checkband"></div><div class="badge">&#9208; Paused</div>'+
      '<h1>Hold that thought</h1><div class="sub">The host is reconnecting. Your score is safe &mdash; the game picks up right where it left off.</div>'+
      '<div class="big pulse" style="color:var(--amberd)">Please wait&hellip;</div></div>';
  }
  var lastFinalSig='', celebrated='';
  function drawFinal(){
    var ranked=STAT.finalRanking(players,scores,sdAll);
    var me=ranked.find(function(x){return x.pid===pid;})||{rank:'-',score:0,correct:0};
    // only redraw when the RESULTS change - otherwise the list would jump to the top while you scroll
    var sig=ranked.map(function(r){return r.pid+':'+r.rank+':'+r.score;}).join('|')+'#'+name;
    if(sig===lastFinalSig && document.getElementById('board')) return;
    lastFinalSig=sig;
    var medals=['\uD83E\uDD47','\uD83E\uDD48','\uD83E\uDD49'];
    var prizeNames=['Grand Prize','Runner-Up Prize','Third Prize'];
    var total=ranked.length;
    var rows=ranked.map(function(r){
      var mine=r.pid===pid, badge=medals[r.rank-1]||('#'+r.rank);
      return '<div class="brow'+(mine?' me':'')+(r.rank<=3?' top':'')+'"'+(mine?' id="myrow"':'')+'>'+
        '<span class="bk">'+badge+'</span><span class="bn">'+esc(r.name)+(mine?' <em>YOU</em>':'')+'</span>'+
        '<span class="bc">'+r.correct+'/'+STAT.QUESTIONS.length+'</span><b class="bs">'+r.score+'</b></div>';
    }).join('');
    var head, sub;
    if(me.rank===1){ head='\uD83C\uDF89 You won!'; sub='1st place - come collect the Grand Prize.'; }
    else if(me.rank===2){ head='\uD83E\uDD48 2nd place!'; sub='You won the Runner-Up Prize - see the host.'; }
    else if(me.rank===3){ head='\uD83E\uDD49 3rd place!'; sub='You won the Third Prize - see the host.'; }
    else { head='Nice game!'; sub='You finished #'+me.rank+' of '+total+' with '+me.score+' points.'; }
    var prizeBanner = (me.rank<=3) ?
      '<div class="rxlabel"><div class="rxl-top"><span>WORLD PHARMACISTS DAY PHARMACY</span><span>Rx #0925-WIN'+me.rank+'</span></div>'+
      '<div class="rxl-pt">PATIENT: '+esc(name).toUpperCase()+'</div>'+
      '<div class="rxl-drug">'+prizeNames[me.rank-1].toUpperCase()+'</div>'+
      '<div class="rxl-sig">Sig: Collect from host STAT. Enjoy with nachos.</div>'+
      '<div class="rxl-foot"><span>Qty: 1</span><span>Refills: 0</span><span>RPh: &#10004;</span></div></div>'
      : '<div class="rtitle" style="margin-top:6px">Final title: <b>'+titleFor(me.rank)+'</b></div>';
    main.innerHTML='<div class="card center"><div class="badge">Final results</div>'+
      (me.rank<=3?'<div class="winstk">'+stk('happy',56,'bob',-8)+stk('verified',56,'bob b2',6)+stk('heart',56,'bob b3',-4)+'</div>':'')+
      '<h1>'+head+'</h1><div class="sub">'+sub+'</div>'+prizeBanner+
      '<div class="mypos"><span>Your position</span><b>#'+me.rank+'</b><span>of '+total+' &middot; '+me.score+' pts &middot; '+(me.correct||0)+' correct</span></div>'+
      '<div class="bhead"><span>Full scoreboard</span><button id="findme" class="findme">&#128205; Find me</button></div>'+
      '<div class="board" id="board">'+rows+'</div>'+
      '<div class="note">&#127881; Happy World Pharmacists Day &mdash; now go get nachos!</div></div>';
    function toMe(smooth){ var b=document.getElementById('board'), m=document.getElementById('myrow'); if(!b||!m) return;
      b.scrollTo({top:m.offsetTop-b.offsetTop-b.clientHeight/2+m.clientHeight/2, behavior:smooth?'smooth':'auto'}); }
    setTimeout(function(){ toMe(false); },30);
    document.getElementById('findme').onclick=function(){ toMe(true); var m=document.getElementById('myrow'); if(m){ m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); } };
    var gk=(state.game||'g');
    if(me.rank<=3 && celebrated!==gk){ celebrated=gk; celebrate(); }   // fanfare once per game, not on every redraw
  }
  function celebrate(){
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    try{
      var a=new (window.AudioContext||window.webkitAudioContext)();
      [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){
        var o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f;
        g.gain.setValueAtTime(0.22,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.35);
        o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.36);
      }, i*130); });
    }catch(e){}
  }

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  // boot
  if(name) doJoinSilent(); else renderJoin();
  function doJoinSilent(){ base.child('players/'+pid).update({name:name,joinedAt:firebase.database.ServerValue.TIMESTAMP}); base.child('players/'+pid+'/online').onDisconnect().set(false); base.child('players/'+pid+'/online').set(true); listen(); }
})();
</script>
</body>
</html>
