<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Pharmacists Day Trivia</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2A1206;--ink2:#3E1D0C;--mint:#FBEFD2;--dim:#C9A87E;--amber:#F0A828;--amberd:#C8371F;--label:#FBEFD2;--link:#2A1206;--alert:#C8371F;--ok:#2E7D5B;--disp:"Barlow Condensed",Arial,sans-serif;--body:"Barlow",Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{background:var(--ink);color:var(--mint);font-family:var(--body);background-image:radial-gradient(circle at 18% 6%,rgba(240,168,40,.20) 0,transparent 42%),radial-gradient(circle at 84% 24%,rgba(200,55,31,.16) 0,transparent 44%),linear-gradient(170deg,#3E1D0C 0%,var(--ink) 55%,#1B0B03 100%);padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 10px}
  header   header .logo{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:800;font-size:26px;color:var(--amber);letter-spacing:-.01em}
  .rxlogo{width:26px;height:26px;color:var(--amber);flex:none}
  .checkband{height:12px;width:100%;
    background-image:linear-gradient(45deg,var(--amberd) 25%,transparent 25%,transparent 75%,var(--amberd) 75%),
                     linear-gradient(45deg,var(--amberd) 25%,transparent 25%,transparent 75%,var(--amberd) 75%);
    background-size:12px 12px;background-position:0 0,6px 6px;border-radius:99px;margin-bottom:14px;opacity:.9}
  header .me{font-family:var(--disp);font-size:16px;color:var(--dim);text-align:right;line-height:1.1}
  header .me b{display:block;color:var(--mint);font-size:19px}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:6px 0 20px}
  .card{background:var(--label);color:var(--link);border-radius:16px;padding:22px 20px;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 3px var(--amber)}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(34px,9vw,48px);line-height:.98;margin-bottom:8px;text-transform:uppercase;letter-spacing:-.01em}
  h1 .h1sub{display:inline-block;background:var(--amberd);color:#fff;padding:2px 12px 4px;border-radius:8px;
    transform:rotate(-1.2deg);box-shadow:3px 3px 0 var(--link);font-size:.82em;margin-top:5px}
  .sub{color:#7A5A38;font-size:15.5px;line-height:1.4;margin-bottom:16px}
  label{display:block;font-family:var(--disp);font-weight:700;font-size:15px;color:var(--amberd);letter-spacing:.03em;margin-bottom:6px}
  input{width:100%;border:2px solid #D9C89A;border-radius:12px;padding:14px;font-size:20px;font-family:var(--body);color:var(--link);background:#fff}
  input:focus{outline:none;border-color:var(--amber)}
  button.go{width:100%;margin-top:16px;border:none;border-radius:12px;padding:16px;font-family:var(--disp);font-weight:800;font-size:22px;background:var(--amber);color:var(--link);letter-spacing:.02em}
  button.go:disabled{opacity:.5}
  .note{color:var(--dim);font-size:13px;text-align:center;margin-top:14px}
  .badge{display:inline-block;background:var(--ink);color:var(--amber);font-family:var(--disp);font-weight:700;border-radius:999px;padding:5px 14px;font-size:13.5px;margin-bottom:12px;letter-spacing:.02em}

  /* question */
  .qmeta{display:flex;justify-content:space-between;font-family:var(--disp);color:var(--amberd);font-size:15px;border-bottom:2px dashed #E7C97D;padding-bottom:8px;margin-bottom:12px}
  .prompt{font-family:var(--disp);font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.1;margin-bottom:12px}
  .tray{background:#EAF0EC;border-radius:12px;box-shadow:inset 0 0 0 5px #C9D6CF;padding:6px;margin-bottom:12px}
  .tray svg{width:100%;height:auto;display:block}
  .mock{display:grid;gap:10px;margin-bottom:12px}.mock.single{grid-template-columns:1fr}
  @media(min-width:460px){.mock:not(.single){grid-template-columns:1fr 1fr}}
  .cardm{background:#fff;border:2px solid #B9AE8E;border-radius:8px;padding:10px 11px;font-family:"Courier New",monospace;color:#111;font-size:13px;line-height:1.4}
  .cardm h4{font-family:var(--disp);font-size:14px;color:var(--amberd);margin-bottom:4px;letter-spacing:.03em}
  .cardm .bar{height:14px;margin-top:8px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 9px,#111 9px 12px,#fff 12px 14px)}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid #E4D6AA;border-radius:12px;padding:15px 14px;margin-bottom:10px;font-family:var(--disp);font-weight:700;font-size:19px;color:var(--link);line-height:1.15;transition:transform .06s,background .15s,border-color .15s}
  .opt:active{transform:scale(.985)}
  .opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--link);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
  .opt.chosen{background:var(--amber);border-color:var(--amberd)}
  .opt.correct{background:var(--ok);border-color:#1E9C72;color:#fff}.opt.correct .k{background:#fff;color:var(--ok)}
  .opt.wrong{background:#F3D9D3;border-color:var(--alert);color:#7A2418}
  .opt:disabled{cursor:default}
  .wager{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .wager button{flex:1;min-width:56px;border:2px solid #E4D6AA;background:#fff;border-radius:12px;padding:14px 0;font-family:var(--disp);font-weight:800;font-size:22px;color:var(--link)}
  .wager button.sel{background:var(--amber);border-color:var(--amberd)}
  .timer{height:8px;border-radius:99px;background:#E4D6AA;overflow:hidden;margin-bottom:14px}
  .timer i{display:block;height:100%;background:var(--amber);width:100%;transition:width 1s linear}
  .timer i.low{background:var(--alert)}

  /* status blocks */
  .big{font-family:var(--disp);font-weight:800;font-size:clamp(32px,10vw,52px);line-height:1;text-align:center}
  .center{text-align:center}
  .score-row{display:flex;justify-content:space-around;margin-top:14px;gap:10px}
  .stat{background:var(--ink);border-radius:12px;padding:12px;flex:1;text-align:center}
  .stat b{display:block;font-family:var(--disp);font-size:30px;color:var(--amber);line-height:1}
  .stat span{font-size:12px;color:var(--dim)}
  .verdict{border-radius:12px;padding:14px;text-align:center;font-family:var(--disp);font-weight:800;font-size:26px;margin-bottom:10px}
  .verdict.yes{background:var(--ok);color:#062;} .verdict.no{background:#F3D9D3;color:#7A2418}
  .fact{font-size:14px;color:#6B5A2E;line-height:1.4;margin-top:4px}
  .pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
  .medal{font-size:44px}
  .rulelist{list-style:none;margin:2px 0 16px;padding:0}
  .rulelist li{position:relative;padding-left:20px;font-size:15px;line-height:1.35;color:#3A2C10;margin-bottom:7px}
  .rulelist li:before{content:"";position:absolute;left:4px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .rulelist b{color:var(--link)}
  .musicopt{display:flex;align-items:center;gap:9px;margin-top:12px;font-family:var(--body);font-size:14.5px;color:#3A2C10;font-weight:600}
  .musicopt input{width:auto;margin:0}
  .cdbar{height:10px;border-radius:99px;background:#E4D6AA;overflow:hidden;margin-bottom:12px}
  .cdbar i{display:block;height:100%;width:100%;background:var(--amber);transition:width .2s linear}
  .cdbar i.low{background:var(--alert)}
  .sdbanner{background:var(--alert);color:#fff;border-radius:12px;padding:12px;text-align:center;
    font-family:var(--disp);font-weight:800;font-size:22px;margin-bottom:12px;letter-spacing:.02em}
  .musicbtn{position:absolute;right:0;top:-2px;background:transparent;border:1px solid #3A5A52;color:var(--dim);
    border-radius:999px;padding:3px 10px;font-size:12px;font-family:var(--disp);font-weight:700}
  .prizewin{margin:10px 0 4px;background:var(--amber);color:var(--link);border-radius:12px;padding:12px;
    font-family:var(--disp);font-weight:800;font-size:22px;box-shadow:0 6px 16px rgba(0,0,0,.22)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg class="rxlogo" viewBox="0 0 100 100" aria-hidden="true"><path d="M20 46 H80 C80 68 68 80 50 80 C32 80 20 68 20 46 Z" fill="currentColor"/><rect x="16" y="40" width="68" height="9" rx="4.5" fill="currentColor"/><rect x="44" y="82" width="12" height="6" rx="3" fill="currentColor"/><path d="M58 38 L78 14" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><circle cx="80" cy="12" r="7" fill="currentColor"/></svg><span>STAT!</span></div>
    <div class="me" id="me"></div>
  </header>
  <main id="main"><div class="center pulse" style="margin:auto;color:var(--dim);font-family:var(--disp);font-size:20px">Connecting…</div></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="game-core.js"></script>
<script src="music.js"></script>
<script>
(function(){
  var main=document.getElementById('main'), meEl=document.getElementById('me');
  var CFG=window.STAT_CONFIG||{};
  var params=new URLSearchParams(location.search);
  var ROOM=(params.get('g')||CFG.room||'PARTY').toUpperCase();

  // identity persists across refresh
  var pid=localStorage.getItem('stat_pid'); if(!pid){pid='p_'+Math.random().toString(36).slice(2,9);localStorage.setItem('stat_pid',pid);}
  var name=localStorage.getItem('stat_name_'+ROOM)||'';

  // firebase
  var db=null, connected=false;
  try{ firebase.initializeApp(CFG.firebase); db=firebase.database(); connected=true; }
  catch(e){ renderFatal('This game link isn\'t set up yet. The host needs to finish the one-time setup (see README).'); }
  if(!db) return;

  var base=db.ref('rooms/'+ROOM);
  var state={phase:'lobby',qIndex:-1}, players={}, scores={}, myAnswers={}, sdMine={}, sdAll={};
  var qShownAt=0, pickedWager=null, lowTimer=null;

  function renderFatal(msg){ main.innerHTML='<div class="card center"><h1>Hmm.</h1><div class="sub">'+msg+'</div></div>'; }

  // ---------- JOIN ----------
  function renderJoin(){
    meEl.textContent='';
    main.innerHTML=
      '<div class="card">'+
        '<div class="checkband"></div>'+
        '<div class="badge">&#127881; World Pharmacists Day &middot; Room '+ROOM+'</div>'+
        '<h1>Pharmacy Trivia<br><span class="h1sub">Celebration Game</span></h1>'+
        '<div class="sub">20 questions. Tap your answer on your phone. Pharmacists, techs and interns &mdash; everyone plays.</div>'+
        '<ul class="rulelist">'+
          '<li><b>10 seconds</b> per question &mdash; it moves on automatically, so answer fast.</li>'+
          '<li><b>Faster = better.</b> Ties are broken by who answered quickest.</li>'+
          '<li><b>Sudden death</b> if anyone is still tied: 5 questions, 5 seconds each.</li>'+
          '<li><b>Prizes</b> for 1st, 2nd and 3rd place.</li>'+
        '</ul>'+
        '<label for="nm">Your name (players will see this)</label>'+
        '<input id="nm" maxlength="24" autocomplete="name" placeholder="e.g. Aisha, tech" value="'+esc(name)+'">'+
        '<label class="musicopt"><input type="checkbox" id="mus" checked> Play music on my phone</label>'+
        '<button class="go" id="join">Join the game</button>'+
        '<div class="note">&#127881; Happy World Pharmacists Day &mdash; good luck!</div>'+
      '</div>';
    var input=document.getElementById('nm');
    document.getElementById('join').onclick=doJoin;
    input.addEventListener('keydown',function(e){if(e.key==='Enter')doJoin();});
    input.focus();
  }
  function doJoin(){
    var v=document.getElementById('nm').value.trim().slice(0,24);
    if(!v){document.getElementById('nm').focus();return;}
    var wantMusic=document.getElementById('mus'); wantMusic=!wantMusic||wantMusic.checked;
    localStorage.setItem('stat_music',wantMusic?'1':'0');
    try{ STATMusic.arm(); if(wantMusic) STATMusic.start(); }catch(e){}
    name=v; localStorage.setItem('stat_name_'+ROOM,name);
    base.child('players/'+pid).update({name:name,joinedAt:firebase.database.ServerValue.TIMESTAMP});
    base.child('players/'+pid+'/online').onDisconnect().set(false);
    base.child('players/'+pid+'/online').set(true);
    listen();
  }

  // ---------- LIVE ----------
  function listen(){
    base.child('state').on('value',function(s){ state=s.val()||{phase:'lobby',qIndex:-1}; draw(); });
    base.child('players').on('value',function(s){ players=s.val()||{}; draw(); });
    base.child('sudden').on('value',function(s){ sdAll=s.val()||{}; sdMine={}; Object.keys(sdAll).forEach(function(k){ if(sdAll[k]&&sdAll[k][pid])sdMine[k]=sdAll[k][pid]; }); draw(); });
    base.child('answers').on('value',function(s){ var a=s.val()||{}; myAnswers={}; Object.keys(a).forEach(function(qk){ if(a[qk]&&a[qk][pid])myAnswers[qk]=a[qk][pid]; }); scores=STAT.computeScores(players,a); draw(); });
    draw();
  }

  function myRank(){ var r=STAT.rankPlayers(players,scores).find(function(x){return x.pid===pid;}); return r||{rank:'—',score:0}; }

  function draw(){
    if(!name){ renderJoin(); return; }
    var r=myRank();
    meEl.innerHTML='<span>'+esc(name)+'</span><b>'+r.score+' pts · #'+r.rank+'</b>';
    var phase=state.phase, qi=state.qIndex;
    var q=(qi>=0&&qi<STAT.QUESTIONS.length)?STAT.QUESTIONS[qi]:null;

    if(phase==='lobby'){
      var n=Object.keys(players).length;
      main.innerHTML='<div class="card center"><div class="badge">Room '+ROOM+'</div><h1>You\'re in!</h1><div class="sub">Waiting for the host to start. '+n+' player'+(n===1?'':'s')+' here so far.</div><div class="big pulse" style="color:var(--amberd);margin-top:8px">Hang tight…</div></div>';
      return;
    }
    if(phase==='ended'){ try{STATMusic.setMode('normal');STATMusic.stop();}catch(e){} drawFinal(); return; }
    if(phase==='sudden_intro'){ try{STATMusic.setMode('sudden');}catch(e){} drawSuddenIntro(); return; }
    if(phase==='sudden'||phase==='sudden_reveal'){ try{STATMusic.setMode('sudden');}catch(e){} drawSudden(phase); return; }
    if(!q){ main.innerHTML='<div class="card center pulse">…</div>'; return; }

    var mine=myAnswers[q.key];
    if(phase==='question'){
      if(mine){ drawLocked(q,mine); }
      else { drawQuestion(q); }
    } else if(phase==='reveal'){
      drawReveal(q,mine);
    }
  }

  function qmeta(q){ return '<div class="qmeta"><span>Round '+q.roundId+' · '+esc(q.roundName)+'</span><span>'+(q.isWager?'Wager 0–5':q.pts+' pt'+(q.pts>1?'s':''))+'</span></div>'; }

  function drawQuestion(q){
    qShownAt=Date.now(); pickedWager=(q.isWager?(pickedWager||0):null);
    var html='<div class="card">'+qmeta(q);
    html+='<div class="cdbar"><i id="bar"></i></div>';
    html+='<div class="prompt">'+esc(q.prompt)+'</div>';
    html+=STAT.extraHTML(q).replace(/<div class="mock/g,'<div class="mock').replace(/class="card"/g,'class="cardm"');
    if(q.isWager){
      html+='<label>1. Your wager</label><div class="wager" id="wg">'+[0,1,2,3,4,5].map(function(n){return '<button data-w="'+n+'"'+(n===pickedWager?' class="sel"':'')+'>'+n+'</button>';}).join('')+'</div><label>2. Your answer</label>';
    }
    html+=q.options.map(function(o,i){return '<button class="opt" data-i="'+i+'"><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
    html+='</div>';
    main.innerHTML=html;
    if(q.isWager){ Array.prototype.forEach.call(document.querySelectorAll('#wg button'),function(b){ b.onclick=function(){ pickedWager=+b.dataset.w; document.querySelectorAll('#wg button').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); }; }); }
    Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){ b.onclick=function(){ submit(q,+b.dataset.i); }; });
    runBar(10);
  }
  function runBar(totalSec){
    var bar=document.getElementById('bar'); if(!bar)return;
    var ends=state.endsAt||(Date.now()+totalSec*1000);
    clearInterval(lowTimer);
    lowTimer=setInterval(function(){
      var left=ends-Date.now(), pct=Math.max(0,Math.min(1,left/(totalSec*1000)));
      bar.style.width=(pct*100)+'%';
      if(pct<0.3) bar.classList.add('low');
      if(left<=0) clearInterval(lowTimer);
    },150);
  }
  function safeKey(k){ return String(k).replace(/[.$#\[\]\/]/g,'-'); }
  function submit(q,i){
    var rec={choice:i,ms:Date.now()-qShownAt}; if(q.isWager)rec.wager=(pickedWager||0);
    // optimistic lock so the phone responds instantly even before the write round-trips
    myAnswers[q.key]=rec; draw();
    base.child('answers/'+safeKey(q.key)+'/'+pid).set(rec).catch(function(){});
    clearInterval(lowTimer);
  }
  function drawLocked(q,mine){
    clearInterval(lowTimer);
    var html='<div class="card">'+qmeta(q)+'<div class="prompt">'+esc(q.prompt)+'</div>';
    html+=q.options.map(function(o,i){var c=i===mine.choice?' chosen':'';return '<button class="opt'+c+'" disabled data-i="'+i+'"><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
    html+='<div class="verdict" style="background:var(--ink);color:var(--amber)">Locked in ✓'+(q.isWager?' · wager '+(mine.wager||0):'')+'</div><div class="center" style="color:var(--dim);font-size:14px">Waiting for the host to reveal…</div></div>';
    main.innerHTML=html;
  }
  function drawReveal(q,mine){
    clearInterval(lowTimer);
    var got=mine&&mine.choice===q.answer;
    var html='<div class="card">'+qmeta(q);
    html+='<div class="verdict '+(got?'yes':'no')+'">'+(got?(q.isWager?'Right! +'+(mine.wager||0):'Correct! +'+q.pts):(mine?(q.isWager?'Missed. −'+(mine.wager||0):'Not this time'):'No answer'))+'</div>';
    html+=q.options.map(function(o,i){var c=i===q.answer?' correct':(mine&&i===mine.choice?' wrong':'');return '<button class="opt'+c+'" disabled><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
    html+='<div class="fact">'+esc(q.fact)+'</div>';
    var r=myRank();
    html+='<div class="score-row"><div class="stat"><b>'+r.score+'</b><span>points</span></div><div class="stat"><b>#'+r.rank+'</b><span>of '+Object.keys(players).length+'</span></div></div>';
    html+='</div>';
    main.innerHTML=html;
  }

  function drawSuddenIntro(){
    var iAmIn = (state.tiedNames||'').indexOf(name)>-1;
    main.innerHTML='<div class="card center">'+
      '<div class="sdbanner">&#9889; SUDDEN DEATH &#9889;</div>'+
      '<h1>'+(iAmIn?'You\'re in the tiebreak!':'Tiebreak time')+'</h1>'+
      '<div class="sub">Tied: <b>'+esc(state.tiedNames||'')+'</b></div>'+
      '<div class="sub" style="margin-top:8px">5 pop-culture questions. <b>5 seconds each.</b> Fastest correct answers win. Everyone can play along.</div>'+
      '<div class="big pulse" style="color:var(--amberd);margin-top:6px">Get ready\u2026</div></div>';
  }
  function drawSudden(phase){
    var si=state.sdIndex||0, q=STAT.SUDDEN[si];
    if(!q){ main.innerHTML='<div class="card center pulse">\u2026</div>'; return; }
    var mine=sdMine[q.key], reveal=(phase==='sudden_reveal');
    var html='<div class="card">'+
      '<div class="qmeta"><span style="color:var(--alert)">SUDDEN DEATH &middot; '+(si+1)+' of '+STAT.SUDDEN.length+'</span><span>5 sec</span></div>';
    if(!reveal) html+='<div class="cdbar"><i id="bar"></i></div>';
    html+='<div class="prompt">'+esc(q.prompt)+'</div>';
    if(reveal){
      var got=mine&&mine.choice===q.answer;
      html+='<div class="verdict '+(got?'yes':'no')+'">'+(got?'Correct!':(mine?'Missed':'No answer'))+'</div>';
      html+=q.options.map(function(o,i){var c=i===q.answer?' correct':(mine&&i===mine.choice?' wrong':'');
        return '<button class="opt'+c+'" disabled><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
    } else if(mine){
      html+=q.options.map(function(o,i){var c=i===mine.choice?' chosen':'';
        return '<button class="opt'+c+'" disabled><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
      html+='<div class="center" style="color:var(--dim);font-size:14px">Locked in \u2713</div>';
    } else {
      html+=q.options.map(function(o,i){
        return '<button class="opt" data-i="'+i+'"><span class="k">'+STAT.LETTERS[i]+'</span><span>'+esc(o)+'</span></button>';}).join('');
    }
    html+='</div>';
    main.innerHTML=html;
    if(!reveal && !mine){
      qShownAt=Date.now();
      Array.prototype.forEach.call(document.querySelectorAll('.opt[data-i]'),function(b){
        b.onclick=function(){
          var rec={choice:+b.dataset.i, ms:Date.now()-qShownAt};
          sdMine[q.key]=rec; draw();
          base.child('sudden/'+q.key+'/'+pid).set(rec).catch(function(){});
        };
      });
      runBar(5);
    }
  }

  function drawFinal(){
    var ranked=STAT.rankPlayers(players,scores);
    if(Object.keys(sdAll).length){
      var sdRank=STAT.rankSudden(players,sdAll);
      var order={}; sdRank.forEach(function(r,i){ order[r.pid]=i; });
      var tiedSet={}; STAT.findTies(ranked).forEach(function(t){ tiedSet[t.pid]=1; });
      ranked.sort(function(a,b){
        if(b.score!==a.score) return b.score-a.score;
        if(tiedSet[a.pid]&&tiedSet[b.pid]) return (order[a.pid]===undefined?99:order[a.pid])-(order[b.pid]===undefined?99:order[b.pid]);
        if(a.totalMs!==b.totalMs) return a.totalMs-b.totalMs;
        return a.name.localeCompare(b.name);
      });
      ranked.forEach(function(r,i){ r.rank=i+1; });
    }
    var me=ranked.find(function(x){return x.pid===pid;})||{rank:'-',score:0};
    var medals=['\uD83E\uDD47','\uD83E\uDD48','\uD83E\uDD49'];
    var prizeNames=['Grand Prize','Runner-Up Prize','Third Prize'];
    var top=ranked.slice(0,5).map(function(r){
      var mine=r.pid===pid;
      var badge=medals[r.rank-1]||('#'+r.rank);
      return '<div class="opt'+(mine?' chosen':'')+'" disabled style="justify-content:space-between">'+
        '<span><span class="k">'+badge+'</span> '+esc(r.name)+'</span><b>'+r.score+'</b></div>';
    }).join('');
    var head, sub;
    if(me.rank===1){ head='\uD83C\uDF89 You won!'; sub='1st place - come collect the Grand Prize.'; }
    else if(me.rank===2){ head='\uD83E\uDD48 2nd place!'; sub='You won the Runner-Up Prize - see the host.'; }
    else if(me.rank===3){ head='\uD83E\uDD49 3rd place!'; sub='You won the Third Prize - see the host.'; }
    else { head='Nice game!'; sub='You finished #'+me.rank+' with '+me.score+' points.'; }
    var prizeBanner = (me.rank<=3) ? '<div class="prizewin">\uD83C\uDF81 '+prizeNames[me.rank-1]+'</div>' : '';
    main.innerHTML='<div class="card center"><div class="badge">Final results</div>'+
      '<h1>'+head+'</h1><div class="sub">'+sub+'</div>'+prizeBanner+
      '<div style="text-align:left;margin-top:6px">'+top+'</div>'+
      '<div class="note">&#127881; Happy World Pharmacists Day &mdash; now go get nachos!</div></div>';
    if(me.rank<=3) celebrate();
  }
  function celebrate(){
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    try{
      var a=new (window.AudioContext||window.webkitAudioContext)();
      [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){
        var o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f;
        g.gain.setValueAtTime(0.22,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.35);
        o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.36);
      }, i*130); });
    }catch(e){}
  }

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  // boot
  if(name) doJoinSilent(); else renderJoin();
  function doJoinSilent(){ base.child('players/'+pid).update({name:name,joinedAt:firebase.database.ServerValue.TIMESTAMP}); base.child('players/'+pid+'/online').onDisconnect().set(false); base.child('players/'+pid+'/online').set(true); listen(); }
})();
</script>
